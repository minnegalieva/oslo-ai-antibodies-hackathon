 ['VHH / nanobody','The binding domain of a camelid heavy-chain-only antibody, used on its own: ~120 amino acids, three CDRs, ~15 kDa, no light chain. (“Nanobody” is an Ablynx trademark; VHH is the generic term.)'],
 ['Wet lab','Physical experiments, as opposed to computation (dry lab).'],
 ['ΔΔG','Change in binding free energy on mutation. Negative usually means tighter.'],
 ['Biotite · BioPython','Python libraries for reading and analyzing protein structure files.'],
 ['Claude Science','Anthropic’s research workbench for scientists, run on the lab’s own machines. It can download and visualize structures for you.'],
 ['Å (angstrom)','One ten-billionth of a meter. The unit for distances between atoms and for structure resolution.'],
 ['Agent (AI agent)','An AI assistant that can run tools and code on its own to carry out a task.'],
 ['Alanine scan','Swapping residues one at a time for alanine to see which ones matter for binding. A computational mutational scan does the same in software.'],
 ['Albumin binder','A small binder that attaches to albumin, a long-lived blood protein, so a fused drug stays in circulation longer.'],
 ['Amino acid names','Each amino acid has a one-letter code: A alanine, C cysteine, H histidine, M methionine, N asparagine, R arginine, W tryptophan, Y tyrosine, and so on.'],
 ['API','A way for programs, and AI agents, to talk to a service.'],
 ['Assay','A lab test that measures something, such as binding or stability.'],
 ['Backbone · side chain','The backbone is the repeating chain that runs through a protein; side chains are the parts that differ between amino acids.'],
 ['Bioinformatics','Using computation to analyze biological data such as sequences and structures.'],
 ['Biologic','A drug made by living cells, such as an antibody, as opposed to a small chemical molecule.'],
 ['Clash','Two atoms placed impossibly close together. A sign that a predicted pose is not physical.'],
 ['Clearance','How quickly the body removes a drug. A bare VHH is cleared by the kidneys within hours.'],
 ['Cold chain · shelf life','Keeping a drug refrigerated from factory to patient · how long it stays usable. Fragile molecules need both.'],
 ['Competition assay','A test of whether two binders compete for the same patch on a target. If they do, they bind overlapping epitopes.'],
 ['Conformation','One particular 3D shape a flexible molecule can take. A target can exist in several conformational states.'],
 ['Cryo-EM · X-ray crystallography','Lab methods that determine a protein’s 3D structure. The result is a crystal structure (or cryo-EM structure) stored in the PDB.'],
 ['Cysteine · disulfide bond','Cysteine is the amino acid that can pair up with another cysteine to form a disulfide bond, a chemical bridge that helps hold a fold together. An unpaired cysteine can cause trouble.'],
 ['Cytokine · cytokine release','A cytokine is a small signaling protein that immune cells use to talk to each other. Cytokine release is a flood of them, which can be dangerous.'],
 ['De novo design · conditional generation','Designing a binder from scratch instead of editing an existing one · generating candidates that meet a condition, such as binding a chosen patch.'],
 ['Diffusion model','A generative model that starts from noise and refines it step by step into a structure (RFdiffusion is one).'],
 ['Docking · pose','Docking is predicting how two molecules fit together; a pose is one predicted position and orientation of one molecule relative to the other.'],
 ['Domain','A compact piece of a chain that folds on its own, drawn as an oval in the schematics.'],
 ['Dry lab','Computational work, as opposed to physical experiments in the wet lab.'],
 ['Effector function','The immune killing an antibody’s stem (Fc) can recruit, such as ADCC and CDC. A bare VHH has no Fc, so it has none.'],
 ['Endosome','A compartment inside cells, mildly acidic (pH 5.5–6), where antibodies are recycled.'],
 ['Ensemble','Many predictions of the same thing (different seeds or models) used together instead of trusting one.'],
 ['Epitope mapping','Lab methods that find which patch of a target a binder touches, such as alanine scans and competition assays.'],
 ['Escape variant','A mutated form of a target that a binder no longer recognizes.'],
 ['Expression · titer · yield','Getting cells such as bacteria or yeast to produce a protein · how much accumulates per liter (g/L) · how much you end up with.'],
 ['Extracellular','Outside cells, for example in the blood at pH 7.4.'],
 ['FASTA','A plain-text file format for sequences.'],
 ['FDA','The US Food and Drug Administration, which approves drugs in the United States.'],
 ['FEP · TI · molecular dynamics','Molecular dynamics (MD) simulates how atoms move over time. FEP and TI (free-energy perturbation, thermodynamic integration) use it to compute binding free-energy changes. Rigorous but slow.'],
 ['Fold · folding','The 3D shape a chain settles into · the process of reaching it.'],
 ['FoldX · Rosetta','Widely used scoring programs that estimate energies and mutation effects in protein structures. Fast, but fitted mainly on compact proteins.'],
 ['Force field','The set of equations a simulation uses for how atoms attract and repel each other.'],
 ['Formulation','The liquid recipe (buffer, salts, concentration) a drug is stored and injected in.'],
 ['Globular protein','A compact, roughly round protein, as opposed to a long, stringy or membrane-bound one.'],
 ['Glycan · glycosylation','A glycan is a sugar chain attached to a protein; glycosylation is the attaching. Glycans can shield a target surface or sit at a risky spot on an antibody.'],
 ['Heavy chain · light chain','The two kinds of chain in a conventional antibody: two of each, joined into a Y. A VHH has only a heavy-chain-type domain.'],
 ['Henderson–Hasselbalch equation','The equation linking pH to the fraction of a group that is charged.'],
 ['Hit · lead','A hit is anything that binds at all; a lead is a hit worth improving further.'],
 ['Histidine · pKa · protonation','Histidine is the amino acid whose charge flips near pH 6, which makes it useful for pH-dependent binding. pKa is the pH at which half of it is charged; protonated means carrying an extra proton, and so a positive charge.'],
 ['Hotspot residues','The few residues on a target surface that contribute most to binding. A generative model can be told to aim at them.'],
 ['IgG','The most common antibody type in blood: a Y-shaped molecule of two heavy and two light chains, about 150 kDa.'],
 ['Immunization','Injecting an animal with a target so its immune system makes antibodies against it.'],
 ['Immunoglobulin','Another word for antibody. An immunoglobulin domain is the oval-shaped fold unit antibodies are built from.'],
 ['In vitro · in vivo','In a test tube or dish · in a living body.'],
 ['Interface','The surface where two molecules touch.'],
 ['kcal/mol','The energy unit used for binding. A binding energy of −12 kcal/mol is about 1 nM, and every 1.4 kcal/mol is a tenfold change in KD.'],
 ['kDa','Kilodalton, a unit of molecular mass. A VHH is about 15 kDa and an IgG about 150 kDa.'],
 ['kon · koff','How fast a binder attaches (on-rate) and lets go (off-rate). KD equals koff divided by kon.'],
 ['Liability motif','A short sequence pattern that tends to cause chemical trouble, such as NG (deamidation), DG (isomerization), N-x-S/T (an unwanted sugar attachment) or DP (acid-labile: it can break at low pH).'],
 ['Library','A large collection of different sequences that is screened for binders.'],
 ['Linker','A short flexible stretch that joins two protein parts, as in an scFv.'],
 ['Loop','A stretch of chain that sticks out instead of forming a regular helix or sheet. CDRs are loops.'],
 ['Lysozyme','A small, well-studied enzyme. Hen egg-white lysozyme is the target in the tutorial.'],
 ['-mab drug names','Antibody drugs have names ending in -mab, such as pembrolizumab (Keytruda), rituximab, bevacizumab, blinatumomab and brentuximab vedotin (vedotin is the toxic payload). Caplacizumab (Cablivi) and ozoralizumab are nanobody-based drugs.'],
 ['Model weights','The learned numbers that make up a trained model. Several gigabytes for large models.'],
 ['MSA','Multiple sequence alignment: evolutionary relatives of a sequence lined up, which many structure predictors use as input.'],
 ['nM · pM · µM','Nanomolar, picomolar and micromolar: concentration units used for KD. 1 µM = 1,000 nM and 1 nM = 1,000 pM.'],
 ['Oligomerization','Proteins assembling into pairs or larger groups.'],
 ['One-hot encoding','The simplest way to turn a sequence into numbers: each position becomes a list of 20 zeros with a single 1 for the amino acid present.'],
 ['Off-target · specificity','Specificity is gripping only the intended target; off-target binding is sticking to something else by mistake.'],
 ['Parameterized','Tuned (fitted) on a particular set of examples, so it works best on things like them.'],
 ['PD-1 · VEGF · TSLP','Example drug targets: PD-1 is a brake on T cells, VEGF is a growth signal for blood vessels, and TSLP is an inflammation signal involved in asthma.'],
 ['Pearson correlation','A score from −1 to 1 for how well predictions track measurements. Around 0.3–0.5 is weak to moderate.'],
 ['Pharmacokinetics','How a drug moves through the body over time: absorption, distribution and clearance.'],
 ['Phage display · yeast display · panning','Selecting binders from a huge library by showing each variant on the surface of a phage (a virus that infects bacteria) or a yeast cell. Panning is the repeated rounds of washing away what does not stick and keeping what does.'],
 ['Phases (clinical trials)','Phase 1 tests safety, phase 2 tests early signs of benefit, phase 3 confirms it in large groups before approval.'],
 ['Pipeline','In drug development, the portfolio of candidates at different stages. In software, the chain of steps that carries data from input to result.'],
 ['Prospective validation','Testing predictions against new experiments run after the prediction was made, instead of against data that already existed (retrospective).'],
 ['Proteome','All the proteins an organism makes.'],
 ['PDB · mmCIF · RCSB','The Protein Data Bank is the public archive of experimentally determined structures, browsable at RCSB; mmCIF is the file format its structures come in.'],
 ['PyMOL · ChimeraX','Programs for viewing and analyzing 3D structures.'],
 ['Random seed','The starting number for a model’s randomness. Different seeds give different results.'],
 ['Receptor','A protein on a cell surface that receives signals, and is often the target of a drug.'],
 ['Regression · classifier','Models that predict a number, such as KD · models that predict a category, such as binder or not.'],
 ['Relaxation','A brief energy minimization that nudges a structure to remove clashes.'],
 ['Repertoire','The full set of antibodies or immune receptors a person or animal carries.'],
 ['Repo (repository)','A project folder of code tracked with Git, often hosted on GitHub.'],
 ['Resolution (X-ray)','How finely an X-ray structure shows detail, in Å. Lower is finer. Below 2 Å is often good, but resolution alone does not determine quality.'],
 ['Rank aggregation · stacking','Ways to combine several models: merging their rankings into one · training a small model on top of their outputs.'],
 ['Royalties · milestones · licensing','Deal terms: an ongoing share of sales · payments when goals are reached · permission to use someone’s technology or molecule in exchange for payment.'],
 ['S-1','The document a company files with US regulators before listing its shares.'],
 ['Sampling','How many different arrangements a simulation or model explores.'],
 ['Sequence · structure','A sequence is the string of letters naming a protein’s amino acids in order; the structure is its folded 3D shape.'],
 ['SEC · HIC','Lab methods that read out clumping (size-exclusion chromatography) and exposed oily surface (hydrophobic-interaction chromatography).'],
 ['Small molecule','A conventional chemical drug, far smaller than a protein.'],
 ['Solubility · aggregation','Whether a protein stays dissolved or clumps together.'],
 ['Subcutaneous · infusion','Injected under the skin, as with a pen · dripped into a vein over time, as in an infusion chair.'],
 ['T-cell engager','A bispecific that binds a target on a cancer cell and a T cell at once, pulling them together.'],
 ['T cell · B cell','Immune cells: B cells make antibodies; T cells kill infected cells and coordinate the immune response.'],
 ['TAP · TNP','Therapeutic Antibody Profiler and Therapeutic Nanobody Profiler: tools that flag developability risks by comparing a sequence with clinical-stage therapeutics.'],
 ['Thrombotic thrombocytopenic purpura (aTTP)','A rare blood-clotting disorder. Caplacizumab, the first nanobody-based medicine, treats it.'],
 ['Tumor microenvironment','The surroundings of a tumor, slightly more acidic (about pH 6.7) than healthy tissue.'],
 ['UniProt','A database of protein entries that links each one to its available structures.'],
 ['Variable · constant domains','Variable domains sit at the antibody’s tips and differ between antibodies; constant domains make up the rest and barely change.'],
 ['Viscosity · rheometry','How thick a solution is, measured by rheometry. Concentrated protein drugs can be too thick to inject.'],
 ['Deamidation · isomerization · oxidation','Slow chemical changes to particular amino acids that can alter a drug in storage.'],
 ['van der Waals · electrostatics · hydrogen bond','The weak attractions between atoms: close-contact attraction · attraction or repulsion between charges · a hydrogen shared between two polar atoms.'],
 ['Desolvation · entropy','The cost of stripping water off surfaces that come together · the cost of freezing floppy parts in place.']
];
GLOSSARY.sort((a,b)=>a[0].localeCompare(b[0],'en'));
SH.glossary=()=>`<div class="prose">
  <input type="search" class="glsearch" placeholder="Search ${GLOSSARY.length} terms…" aria-label="Search the glossary" style="width:100%;font:500 16px var(--f-body);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:8px">
  <div class="glgrid">${terms(GLOSSARY,'gloss')}</div>
</div>`;

SH.ref=()=>`<div class="prose">
  <ul>
   <li>AlphaFold2 (Jumper et al., <i>Nature</i> 2021), AlphaFold3 (Abramson et al., <i>Nature</i> 2024) and RFdiffusion (Watson et al., <i>Nature</i> 2023) for what the headline methods actually claim. Then the independent benchmarking papers on antibody–antigen complexes, which are more sobering.</li>
   <li>The ${L('https://www.blopig.com/blog/','OPIG blog')} from the Oxford Protein Informatics Group is the best short-form writing on antibody informatics.</li>
   <li>The “Antibodies to watch” review series in ${L('https://www.tandfonline.com/journals/kmab20','<i>mAbs</i>')}, published annually, for the clinical and commercial landscape in one sitting.</li>
  </ul>
</div>`;

const TRACKS={};
TRACKS.ml={
 title:'More about <em>machine learning</em>',
 tagline:'No machine-learning background assumed, and everything you need to take part is already on the front page.',
 chapters:[
 ['Why this suits machine learning',`
  <p class="lead">A machine-learning model is a program that has learned patterns from a huge number of examples and uses them to make an educated guess about something new. Here, the guesses are things like “what shape will this sequence fold into?” and “do these two proteins stick together?”.</p>
  ${cards([
   ['It is basically text','A VHH is a string of about 120 letters. The whole binder fits on one short line, which is exactly the kind of thing models are good at.'],
   ['The real check is slow','A lab test costs money and takes weeks, so models are used as a cheap filter that decides what is worth testing.'],
   ['Every score is a guess','Models report how confident they are, how stable something looks, how well it might bind. None of those is the truth, and each is wrong in its own way.']
  ])}
  <p>The hard part of the day is not running a model, it is deciding how far to trust what it says.</p>
  ${more('For the technically curious: the data you will meet',`
   ${terms([
    ['Sequence','A string over a 20-letter alphabet, usually in FASTA format.'],
    ['Structure','A PDB or mmCIF file: a list of atoms with coordinates. Biotite and BioPython read them, so nobody writes their own parser.'],
    ['Embedding','A list of numbers a protein language model produces for a sequence or residue. Plain one-hot encoding is a fair baseline and sometimes wins.'],
    ['Contacts','Which VHH residues sit within about 4–5 Å of the antigen. A graph, and a clean input if you want to build a graph model.']
   ])}
   <p>Models trained on general protein data transfer poorly here, because CDR loops (CDR3 above all) are flexible and unlike the rest of the proteome, and public VHH–antigen structures are far fewer than conventional antibody ones.</p>
  `)}`],
 ['Don’t fall for it',`
  <p>These are 4 pieces of advice we can offer.</p>
  ${cards([
   ['Believing one score','Two different methods agreeing is worth more than one very high number.'],
   ['One lucky run','Models involve chance. A result that appears once may be a lucky seed, so repeat it, try a case the pipeline was not tuned on, and show the change.'],
   ['Breaking bonds','Some positions keep the molecule folded, such as the cysteines that form internal bridges. A change that scores well can still ruin the fold.'],
   ['A "perfect" list','You may find that a rough list of reasons and a “how sure” for each design is more valuable than endless numbers.']
  ])}
  ${more('More specifically',`<ul>
   <li><b>Several seeds, unseen cases.</b> Report the spread across random seeds and on at least one case you did not tune on.</li>
   <li><b>Disagreement is information.</b> Where dissimilar predictors disagree, treat that as uncertainty rather than averaging it away. Rank aggregation and stacking on a small held-out set both help.</li>
   <li><b>Re-score after every fix.</b> An edit that removes a liability can break the interface, so re-run the binding score after any change.</li>
   <li><b>Scale.</b> A 15-residue CDR3 has about 3×10<sup>19</sup> possible sequences. Good campaigns propose dozens to low thousands of candidates and justify each filter.</li></ul>`)}`],
 ['Where this helps on the day',`
  ${callout('you','Where you might help','Connecting the steps (generate, score, filter) into one workflow that runs without hand-holding; choosing which designs to put forward and saying why; and checking whether an apparent improvement is real or luck. You do not need to train a model, because the models are provided. And if you do not write code, an AI coding agent can write most of the glue. What it cannot do is decide what is worth doing.')}
  ${more('If you have a spare evening',`${check([
   `<b>Python with a structure parser</b> (Biotite or BioPython) and <b>ANARCII</b> for numbering.`,
   `<b>A viewer:</b> PyMOL, ChimeraX or py3Dmol. Every structure page on the RCSB site also has one in the browser.`,
   `<b>Your agent setup</b>, if you work with one, pointed at a scratch repo and able to run a script.`
  ])}`)}`],
 ]
};

TRACKS.bio={
 title:'More about <em>biology and the lab</em>',
 tagline:'No biology background assumed, and you can skip all of it and still take part.',
 chapters:[
 ['How a binder is found (currently)',`
  <p class="lead">A VHH usually starts in a llama or alpaca. The animal is immunized, its immune cells are collected, and the VHH genes that bind the target are picked out. Or a huge synthetic library is screened instead of an animal. The winners are then produced in bacteria or yeast.</p>
  <p>Because a VHH is a single gene, <b>the sequence you design is literally what a lab would order.</b> The computer pipeline stands in for parts of that process with predictions. Which calculation can replace which experiment, and how well is listed below:</p>
  ${standin([
   ['See the 3D shape','crystal structure, cryo-EM','Structure-prediction models, in the AlphaFold family',4,'Good','Very good for a single VHH, weaker for the binding loops, and unreliable for new complexes.'],
   ['Measure how tightly it binds','SPR, BLI','Energy-based and learned predictors',1,'Weak','They rank better than they measure.'],
   ['Check it stays folded','melting temperature','Stability predictors',3,'Moderate',''],
   ['Find the key contact residues','alanine scan','A computational mutational scan',4,'Useful','Fast, cheap and useful as a guide.'],
   ['Select binders from a library','phage or yeast display','Generate candidates, then filter',0,'Not the same','There is no real selection, so the model’s biases stay in.'],
   ['Check it is not sticky or hard to make','polyreactivity, expression','Rule-based checks on the sequence',2,'Crude','They still catch the obvious problems.']
  ])}`],
 ['What a computer cannot know that you might',`
  <p>A model will happily propose something that looks excellent in theory and is nonsense in a cell. It does not know what it does not know. These are four places where hands-on knowledge of real molecules is worth more than a score:</p>
  ${cards([
   ['Is the target patch actually reachable?','A model may aim at a surface that is hidden under a sugar coating, buried in a membrane, or only present when the target changes shape.'],
   ['Would the fold survive?','A few positions keep a VHH folded and soluble without a light chain. A change there can look fine on a score, but ruin the molecule.'],
   ['Would a cell ever make it?','Some sequences are hard to produce or purify, whatever the scores say, and a few simple patterns in the sequence are known warning signs.'],
   ['Does “binds” mean “works”?','Sticking to the target is not the same as blocking it, and blocking it is not the same as helping a patient. Take the time to discuss it.']
  ])}
  ${more('A few specifics a biologist may be able to spot',`<ul>
   <li><b>Epitope choice:</b> glycan shields, membrane proximity, conformational states, oligomerization, and whether the patch exists in the native context at all.</li>
   <li><b>Breaking the fold:</b> a broken disulfide, a buried charge, a removed conserved framework residue, or the framework-2 “hallmark” residues reverted toward a conventional antibody, after which the VHH may stop being soluble alone.</li>
   <li><b>Liability motifs:</b> a scan flags every match; which ones you need to fix depends on whether they sit in a CDR or an exposed position.</li></ul>`)}`],
 ['Where this helps on the day',`
  ${callout('you','Where you might help','Understanding the target, working out which regions are worth binding, judging whether a proposed design makes biological sense, and saying what would make a binder useful beyond the fact that it sticks. Perhaps your team needs a person who looks at every design before it is submitted. None of this needs you to write code. (But maybe ask Claude.)')}
  ${more('If you want to go a step further',`<p>Install PyMOL or ChimeraX and open the same structure. Then ask a coding agent to list the residues sitting within 5 Å across the VHH–antigen interface. The point is not the script: it is that you will recognize a contact list when a teammate puts one in front of you. Folding something whose structure you already know, and seeing where the model is right (and where it's not), can make you a useful skeptic.</p>`)}`],
 ]
};

TRACKS.phys={
 title:'More about <em>physics and chemistry</em>',
 tagline:'No chemistry background assumed: binding is just energy, and the numbers quoted on the day are stand-ins for it.',
 chapters:[
 ['Binding, as a number',`
  <p class="lead">How tightly two molecules stick is measured by a number called <b>KD</b>. Smaller means tighter: nanomolar (nM) is good, picomolar (pM) is very tight.</p>
  <p>That number is tied to an energy. Every ten-fold improvement in KD is worth about 1.4 kcal/mol, and a 1 nM binder sits near −12 kcal/mol. Try it:</p>
  <div data-widget="kd"></div>
  ${more('The formula, and what the interface looks like',`
  <p>ΔG<sub>bind</sub> = RT ln KD, and at 298 K RT is about 0.59 kcal/mol. A typical antibody–antigen interface buries on the order of 700–900 Å² per side. A VHH, with three loops instead of six, packs its binding patch into a more compact area, often with a long CDR3 doing the main work, so measure your own structure rather than assuming these numbers. Interfaces generally have 15–25 contacting residues, dominated by a few hotspots (tyrosine, tryptophan and arginine are over-represented) with ordered waters bridging the rest.</p>
  `)}`],
 ['Why it is so hard to predict',`
  <p class="lead">A binding energy of −12 kcal/mol is a small leftover from much larger terms that nearly cancel: attractions between atoms, against the cost of squeezing out water and freezing floppy loops. Predicting a 1 kcal/mol difference between big canceling numbers is a genuinely hard physics problem, not just an unsolved engineering one.</p>
  <p>Methods run from careful and slow to quick and crude, and the more careful the method, the fewer variants allowed.</p>
  ${cards([
   ['Careful physics','Simulations that follow the atoms. The most rigorous, but hours to days per mutation, which is not realistic in one day.'],
   ['Rough empirical scores','Fitted scoring functions (FoldX and Rosetta are the well-known ones) that answer in seconds. They are tuned on ordinary compact proteins, so floppy loops are a poor fit.'],
   ['Learned models','Predictors trained on measured data, answering in milliseconds. Reasonable inside what they have seen and unreliable outside it.']
  ])}
  ${more('The numbers behind that',`<p>A binding free energy of about −12 kcal/mol (a 1 nM binder) is the small residual of tens of kcal/mol of van der Waals, electrostatics and hydrogen bonding, set against desolvation and the entropy cost of freezing flexible CDR loops (a long CDR3 pays the most). On antibody ΔΔG benchmarks such as AB-Bind (built mainly on conventional antibodies; matching VHH data is scarcer), classical scoring functions land around Pearson 0.3–0.5.</p>`)}
  ${callout('tip','Please check','If a method claims a mutation gains 5 kcal/mol, that is a few thousand-fold in KD from a single point change. It happens, rarely. Most single mutations land roughly between −1 and +2 kcal/mol, so anything far outside that may be the model reporting its own failure.')}
  <p>Developability is physics too: folding stability, clumping from exposed oily patches, and a handful of specific slow chemical reactions. Which of those one may have to optimize around depends on pH, buffer and storage.</p>
  <p>NB: Molecular dynamics will be available, if you can manage it.</p>
  ${more('The methods side by side',`<div class="mth" role="list">
   <div class="mth-h" aria-hidden="true"><span>Method</span><span>Time per variant</span><span>Wait a minute!</span></div>
   ${[
    ['MD free-energy methods','FEP, TI','Rigorous ΔΔG within a force field','Hours to days on GPU',100,'Force-field error, sampling, charge-changing mutations'],
    ['MM/GBSA, MM/PBSA','','End-point approximation','Minutes',62,'Entropy handled crudely; ranking at best'],
    ['Co-folding models','','Structure plus a confidence score','Minutes',62,'Confidence is not affinity; novel epitopes predicted poorly'],
    ['FoldX, Rosetta','','Empirical scoring with fitted terms','Seconds',36,'Parameterized on globular proteins; a long CDR3 is a poor fit'],
    ['Learned ΔΔG models','','Statistical regression on sequence or structure','Milliseconds',12,'Out-of-distribution sequences']
   ].map(([n,sub,w,c,pct,f])=>`<div class="mth-r" role="listitem"><div class="mth-m"><b>${n}</b>${sub?`<i>${sub}</i>`:''}<span>${w}</span></div><div class="mth-c"><div class="mth-bar"><span style="width:${pct}%"></span></div><small>${c}</small></div><div class="mth-f"><small class="mth-fl">Where it breaks</small>${f}</div></div>`).join('')}
  </div>`)}`],
 ['Where this helps on the day',`
  ${callout('you','Where you might help','Judging whether a predicted complex is physically sensible (does it pack well, are there clashes, do the charges make sense), whether a reported difference is bigger than the noise, and which method to trust for which question. Discussing units and error bars is a good contribution: asking what a number is measured in, and whether a gap of 0.3 on some arbitrary score means anything.')}`],
 ]
};

TRACKS.clin={
 title:'More about <em>the medicine</em>',
 tagline:'Medicine is the reason this field exists, and this page connects what happens to patients to what the team will be designing.',
 chapters:[
 ['From a patient’s problem back to the molecule',`
  <p class="lead">Almost every property clinicians know about an antibody drug traces back to something an engineer can edit, either in the binding domain (here a VHH) or in what it is attached to.</p>
  ${tbl(['What clinicians see','Why it happens','What engineers change'],[
   ['Infusion reactions, or a drug that stops working over months','The body makes antibodies against the drug itself, because part of it looks foreign','Make the sequence look more human (humanization)'],
   ['Dosing every few weeks','Antibodies are recycled in the body, so a standard one lasts about three weeks','Tweak the stem so it lasts longer'],
   ['A bare nanobody works for hours, not weeks','It is so small that the kidneys filter it out','Attach something that keeps it in circulation, or use the short action on purpose'],
   ['An infusion chair instead of a pen','At high concentration proteins clump or turn thick','Make it more soluble'],
   ['Side effects in healthy tissue','The target is also present on healthy cells','Tune how tightly it binds, or pick a different patch'],
   ['Different patients respond differently','Targets and immune receptors vary between people','Choose the patch and the format with that variation in mind'],
   ['Cold chain and short shelf life','The molecule is fragile','Make it sturdier']
  ])}
  ${callout('warn','Surprise?','Tighter binding is not automatically better. In solid tumors a very tight binder can get stuck at the first target it meets at the edge of a blood vessel and never reach the tissue behind it. For T-cell engagers, too tight can trigger a dangerous cytokine release. Target affinity is a design decision, not a maximum.')}
  ${more('How antibody drugs work',`
  <p>Antibody drugs work by <b>blocking</b> a target (bevacizumab on VEGF-A, pembrolizumab on PD-1), by recruiting immune killing through the stem, or Fc (ADCC, ADCP and CDC, as with rituximab), by delivering a <b>payload</b> (antibody–drug conjugates such as brentuximab vedotin), or by <b>bridging two cells</b> (T-cell engagers such as blinatumomab). Which one you want changes what you optimize. A bare VHH has no Fc, so it can block or deliver but cannot recruit effector cells unless fused to one.</p>
  `)}
  ${more('Why a nanobody is a different kind of drug',`
  <p>Half-life, tissue penetration and kidney clearance all scale with size. An IgG is about 150 kDa and circulates for weeks. A VHH is about 15 kDa: it penetrates tissue well, can reach clefts a full antibody cannot, and clears through the kidneys in hours unless extended. Formats are therefore built by fusion: an Fc or an albumin binder for half-life, or several VHHs joined to bind two targets. Format choice is a pharmacokinetics decision before it is a binding one.</p>
  <p>Approved examples: <b>caplacizumab</b> (Cablivi), the first nanobody-based medicine, for a rare blood-clotting disorder (acquired thrombotic thrombocytopenic purpura), and <b>ozoralizumab</b>, approved in Japan for rheumatoid arthritis.</p>
  `)}`],
 ['Questions worth asking your team',`
  <p>Most computational minds can rank sequences. Far fewer can say which of those rankings would survive contact with patients. These are five questions you could discuss with your team:</p>
  ${cards([
   ['Who is the patient?','And what does the current standard of care already give them?'],
   ['Is this target expressed anywhere we would regret?','What is the safety margin?'],
   ['Would this change raise a new immunogenicity concern?','Or could it even remove one?'],
   ['What is the route and the dose?','Does the molecule being designed fit that?'],
   ['What would the first trial in people measure?','The answer may give you an idea where to optimize (next).']
  ])}
  <p>If a teammate quotes a number you do not recognize, the reference table under <a href="#beyond">What is developability?</a> on the front page lists the usual targets in plain language.</p>`],
 ['Where this helps on the day',`
  ${callout('you','Where you might help','Saying who the patient is, what current treatment already gives them, and what would have to be true for this molecule to be worth making. Two of the four judging criteria, user fit and path to value, are exactly that, and worth taking some time to consider.')}
  ${more('If you happen to have more time',`<ul>
   <li><i>Janeway’s Immunobiology</i>, the chapters on antibody structure and B-cell development, if a copy is already within reach. Not worth buying for one day.</li>
   <li>One review on developability assessment, for why molecules fail after they bind perfectly well. Might come in handy.</li></ul>`)}`],
 ]
};

TRACKS.biz={

  </div>
  ${callout('you','Where nanobodies fit','The figures above are for the whole antibody market. Nanobodies are a small, younger slice of it, with a handful of approved products. The pitch for them is what a full antibody struggles with: reaching hidden targets, tolerating harsh conditions, cheap production in microbes, and modular formats that join several binders into one molecule. Their weak spot is fast kidney clearance, so half-life extension is usually part of the product.')}
  <p>Developing a drug is commonly quoted as taking 10 to 15 years and over a billion dollars end to end. Discovery, the first stage, is a small slice of that cost but is the source of most of the later failures.</p>`],
 ['Where the value in antibody design sits',`
  <p class="lead">The money is not in generating sequences. Sequences are cheap. The money is in avoiding wasted experiments and avoiding late-stage failures.</p>
  ${tbl(['Stage','Rough cost and time','Where a tool helps','Value of being right'],[
   ['Target selection','Months','Epitope and liability assessment','Enormous, rarely addressed'],

  <p class="note-s">Costs and durations in this table are illustrative ballparks, not sourced figures.</p>
  <p>A single wet-lab round of expressing and testing a panel of binder variants costs very roughly 10,000 to 100,000 USD and takes weeks. A tool that cuts the number of rounds from four to two is selling <b>time, not software</b>. That is the framing buyers respond to.</p>`],
 ['Who buys, and what they are buying',`

  <div class="cards">

 ['Where this helps on the day',`

  const toc=E(`<div class="ptocwrap"><div class="ptoc"><div class="ptocg"><h3>The guide</h3>${PCH.map(([t,ids],n)=>`<a href="#pch-${n+1}"><i>${n+1}</i>${t}</a>${ids.length>1?`<span class="sub2">${ids.map(x=>{const h=take(x).querySelector('h2');return h?h.textContent:''}).join(' · ')}</span>`:''}`).join('')}</div>
    <div class="ptocg"><h3>Optional topic pages</h3>${TRACK_ORDER.map((k,n)=>`<a href="#p-${k}"><i>${'ABCDE'[n]}</i>${$('#p-'+k+' h1',doc).textContent}</a>`).join('')}<h3 style="margin-top:14px">Reference</h3><a href="#s-ref"><i>R</i>Further reading</a><a href="#s-glossary"><i>G</i>Glossary</a></div></div>
    <p class="puse"><b>Using this printout.</b> The “+” sections are open so the technical detail is on paper; skip them freely. Links show their address after the text. The interactive calculators live on the website’s Toolbox page. Tick “Wide margin for notes” before printing if you want room beside the text; the notes pages are there for your own annotations.</p></div>`);
  wel.appendChild(toc); wel.appendChild(take('start'));
  const chapters=[wel];
  PCH.forEach(([t,ids],n)=>{
    const w=mk('pch'+(n+1),`${n+1} · ${t}`,`Chapter ${n+1}`,t); w.id='pch-'+(n+1);
    ids.forEach(x=>w.appendChild(take(x))); chapters.push(w);
  });
  // notes page after the guide
  const notes1=E(`<div class="pch" style="page:pnotes"><div class="pchlabel"><b>Notes</b><span>Questions, ideas, teammates</span></div><p class="pnoteh">Notes for the day</p><p>Write down what you want to ask a mentor, and what your team decides.</p><div class="plines">${"<i></i>".repeat(24)}</div></div>`);
  pages.push(['pnotes','Notes']);
  chapters.push(notes1);
  // topic pages
  const tracks=$$('.ptrack',doc);
  tracks.forEach((t,n)=>{
    const name='ptr'+n, h=$('h1',t).textContent;
    t.style.page=name; pages.push([name,`Topic page ${'ABCDE'[n]} · ${h}`]);
    t.insertAdjacentHTML('afterbegin',`<div class="pchlabel"><b>Topic page ${'ABCDE'[n]}</b><span>Optional reading</span></div>`);
    chapters.push(t);
  });
  // reference + partners
  const ref=mk('pref','Reference','Reference','Further reading'); ref.id='pch-ref';
  ref.appendChild(take('ref')); chapters.push(ref);
  const glo=mk('pglos','Glossary','Glossary','Terms in plain words'); glo.id='pch-glossary'; glo.appendChild(take('glossary'));
  const foot=$('footer.foot',doc); glo.appendChild(foot); chapters.push(glo);
  const notes2=E(`<div class="pch" style="page:pnotes2"><div class="pchlabel"><b>Notes</b><span>Anything else</span></div><div class="plines">${"<i></i>".repeat(24)}</div></div>`);
  pages.push(['pnotes2','Notes']); chapters.push(notes2);
  const oldNote=$('.pnote',doc); if(oldNote)oldNote.remove();
  [...doc.children].forEach(c=>{if(c!==cover)c.remove()});
  chapters.forEach(c=>doc.appendChild(c));
  // running headers and page numbers
  const q=x=>'"'+String(x).replace(/["\\]/g,'')+'"';
  const box=(h)=>`@top-left{content:${q(h)};${'font:600 7.5pt var(--f-body);color:#777;letter-spacing:.04em;text-transform:uppercase;vertical-align:bottom;padding-bottom:3mm'}}
    @top-right{content:"AI × Antibodies";font:600 7.5pt var(--f-body);color:#999;letter-spacing:.04em;text-transform:uppercase;vertical-align:bottom;padding-bottom:3mm}
    @bottom-left{content:${q('Participant field guide · '+EVENT.date)};font:500 7.5pt var(--f-body);color:#888;vertical-align:top;padding-top:3mm}
    @bottom-right{content:counter(page);font:600 8pt var(--f-body);color:#555;vertical-align:top;padding-top:3mm}`;
  let css=`@page{size:A4;margin:20mm 14mm 18mm;${box('')}}
  @page pcover{margin:0;@top-left{content:none}@top-right{content:none}@bottom-left{content:none}@bottom-right{content:none}}\n`;
  pages.forEach(([n,h])=>{css+=`@page ${n}{margin:20mm 14mm 18mm;${box(h)}}\n`});
  let st=document.getElementById('printpages'); if(!st){st=document.createElement('style');st.id='printpages';document.head.appendChild(st)}
  st.textContent=css;
  // wording that only made sense on screen
  const rep=[[/one click away/g,'set apart in “+” sections'],
    [/click it to open the technical version in place\. You never have to\./g,'that is the optional technical version. You never have to read it.'],
    [/the technical detail is one click away/g,'the technical detail follows in “+” sections'],
    [/Click any “\+” line for the technical detail\./g,'The “+” lines hold the technical detail.'],
    [/Each tab holds/g,'Each group below holds'],
    [/Open the ones outside your own field and skim the rest\./g,'Read the ones outside your own field and skim the rest.'],
    [/([Tt])he Toolbox/g,(m,a)=>a+'he website’s Toolbox'],
    [/\(Figure 1A; hover over or tap a loop or chain to see its name\)/g,'(Figure 1A)']];
  const tw=document.createTreeWalker(doc,NodeFilter.SHOW_TEXT);const nodes=[];while(tw.nextNode())nodes.push(tw.currentNode);
  nodes.forEach(n=>{let t=n.nodeValue,o=t;rep.forEach(([a,b])=>{t=t.replace(a,b)});if(t!==o)n.nodeValue=t});
  $$('figcaption b,.fcap b',doc).forEach(b=>{if(/hover or tap/i.test(b.textContent))b.style.display='none'});
  // controls
  const exp=$('#pexp'), nm=$('#pnotes');
  const apply=()=>$$('details',app).forEach(d=>d.open=exp.checked);
  exp.addEventListener('change',apply);apply();
  const applyN=()=>document.documentElement.classList.toggle('pnotes',nm.checked);
  nm.addEventListener('change',applyN);applyN();
  $('#pgo').addEventListener('click',()=>window.print());
  $$('[data-pdf]',app).forEach(btn=>btn.addEventListener('click',async()=>{
    const label=btn.textContent,url=btn.dataset.pdf,name=btn.dataset.name;
    btn.disabled=true;btn.textContent='Preparing…';
    try{
      const dl=(window.claude&&claude.use)?await claude.use('downloads'):null;
      if(dl){const r=await fetch(url);if(!r.ok)throw new Error('fetch');await dl.save({filename:name,data:await r.blob()})}
      else window.open(url,'_blank','noopener');
    }catch(e){if(!(e&&e.code==='declined'))btn.textContent='Could not download'; else btn.textContent=label}
    finally{btn.disabled=false;if(btn.textContent==='Preparing…')btn.textContent=label;else setTimeout(()=>btn.textContent=label,2500)}
  }));
  $$('a[href^="#"]',app).forEach(a=>a.addEventListener('click',e=>{
    const h=a.getAttribute('href').slice(1);
    const t=document.getElementById(h)||document.getElementById('s-'+h)||document.getElementById('p-'+h);
    if(t&&t.closest('.pdoc')){e.preventDefault();t.scrollIntoView()}
  }));
}
function centerChip(el){if(!el)return;const c=el.parentElement;c.scrollTo({left:el.offsetLeft-c.clientWidth/2+el.offsetWidth/2,behavior:'smooth'})}
function setupScroll(id){
  const bar=$('#bar');
  const upd=()=>{const h=document.documentElement;const p=h.scrollTop/((h.scrollHeight-h.clientHeight)||1);bar.style.width=(Math.min(1,Math.max(0,p))*100)+'%'};
  window.onscroll=upd;upd();
  if(id==='home'){
    const sl=$$('.stoc a'),secs=$$('.sec[id^="s-"]');let cur=null,tick=false;
    const sync=()=>{tick=false;const y=innerHeight*.35;let k=null;secs.forEach(x=>{const r=x.getBoundingClientRect();if(r.top<=y&&r.bottom>y)k=x.id.slice(2)});
      if(k===null&&secs.length){k=secs[0].getBoundingClientRect().top>y?secs[0].id.slice(2):secs[secs.length-1].id.slice(2)}
      if(k===cur)return;cur=k;sl.forEach(l=>l.classList.toggle('on',l.dataset.sec.split(' ').includes(k)));centerChip($('.stoc a.on'))};
    const req=()=>{if(!tick){tick=true;requestAnimationFrame(sync)}};
    window.onscroll=()=>{upd();req()};sync();return}
  if(!TRACK_ORDER.includes(id))return;
  const links=$$('.toc a'),secs=$$('.chap');if(links[0])links[0].classList.add('on');
  if(!('IntersectionObserver' in window))return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle('on',l.dataset.ch===String(+e.target.dataset.i+1)));if(window.innerWidth<1100)centerChip($('.toc a.on'))}}),{rootMargin:'-25% 0px -65% 0px'});
  secs.forEach(s=>io.observe(s));
}
function setupCountdown(){
  clearInterval(cdTimer);
  const upd=()=>{const ms=new Date(EVENT.iso)-new Date();const d=$('#days'),l=$('#cdlabel');if(!d)return;
    if(ms>86400000){d.textContent=Math.ceil(ms/86400000);l.textContent='days to go'}
    else if(ms>0){d.textContent=Math.ceil(ms/3600000);l.textContent='hours to go'}
    else{d.textContent='Today';l.textContent='is the day'}};
  upd();cdTimer=setInterval(upd,60000);
}
try{const t=localStorage.getItem('aiab-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
window.addEventListener('hashchange',render);
render();
