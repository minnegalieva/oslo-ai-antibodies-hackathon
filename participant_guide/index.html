<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI × Antibodies — Participant field guide (plain-language version)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3EC; --surface:#FFFFFF; --surface-2:#EFEBE1; --ink:#16131F; --muted:#5A566A; --line:#E0DACB;
  --violet:#6B4EFF; --green:#119B57; --orange:#E5600B; --blue:#0A82B3; --rose:#D63A72;
  --violet-s:rgba(107,78,255,.11); --green-s:rgba(17,155,87,.12); --orange-s:rgba(229,96,11,.12); --blue-s:rgba(10,130,179,.12); --rose-s:rgba(214,58,114,.12);
  --accent:var(--violet); --accent-s:var(--violet-s);
  --good:#119B57; --mid:#D99A00; --bad:#D6453A;
  --shadow:0 1px 2px rgba(22,19,31,.05),0 10px 34px rgba(22,19,31,.08);
  --r:20px; --hh:60px;
  --f-head:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D0C14; --surface:#17151F; --surface-2:#1F1C2A; --ink:#F2EFFA; --muted:#A8A3BB; --line:#2B2839;
    --violet:#8F7BFF; --green:#38C77F; --orange:#FF8A3D; --blue:#3CB6E8; --rose:#FF6A9C;
    --violet-s:rgba(143,123,255,.16); --green-s:rgba(56,199,127,.15); --orange-s:rgba(255,138,61,.16); --blue-s:rgba(60,182,232,.16); --rose-s:rgba(255,106,156,.16);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0C14; --surface:#17151F; --surface-2:#1F1C2A; --ink:#F2EFFA; --muted:#A8A3BB; --line:#2B2839;
  --violet:#8F7BFF; --green:#38C77F; --orange:#FF8A3D; --blue:#3CB6E8; --rose:#FF6A9C;
  --violet-s:rgba(143,123,255,.16); --green-s:rgba(56,199,127,.15); --orange-s:rgba(255,138,61,.16); --blue-s:rgba(60,182,232,.16); --rose-s:rgba(255,106,156,.16);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.35); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);scroll-behavior:smooth;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16.5px/1.65 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
a{color:var(--accent);text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.08;letter-spacing:-.02em;margin:0}
p{margin:0 0 1em}
b,strong{font-weight:600}
code,.mono{font-family:var(--f-mono);font-size:.86em;background:var(--surface-2);padding:.12em .4em;border-radius:6px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:none;margin:0 auto;padding:0 clamp(20px,5vw,80px)}

/* theme per track */
body[data-track=ml]{--accent:var(--violet);--accent-s:var(--violet-s)}
body[data-track=bio]{--accent:var(--green);--accent-s:var(--green-s)}
body[data-track=phys]{--accent:var(--orange);--accent-s:var(--orange-s)}
body[data-track=clin]{--accent:var(--blue);--accent-s:var(--blue-s)}
body[data-track=biz]{--accent:var(--rose);--accent-s:var(--rose-s)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:var(--hh)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.brand svg{width:30px;height:30px}
.brand b{font:700 17px/1 var(--f-head);letter-spacing:-.02em}
.brand small{display:block;font:500 11px/1.2 var(--f-mono);color:var(--muted);margin-top:3px;letter-spacing:.02em}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;padding:4px 2px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;text-decoration:none;color:var(--ink);font:500 13.5px/1 var(--f-body);border:1px solid transparent;white-space:nowrap}
.nav a:hover{background:var(--surface-2)}
.nav a .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.nav a[aria-current=page]{background:var(--ink);color:var(--bg)}
.nav .sep{flex:none;width:1px;background:var(--line);margin:6px 4px}
.nav .navlbl{flex:none;align-self:center;font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 4px 0 8px}
.themebtn{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.themebtn svg{width:17px;height:17px}
.progress{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + var(--hh));height:3px;z-index:49;background:transparent}
.progress i{display:block;height:100%;width:0;background:var(--accent)}

/* hero */
.hero{position:relative;overflow:hidden;padding:56px 0 34px}
.hero::before{content:"";position:absolute;inset:-20% -10% auto -10%;height:120%;z-index:0;pointer-events:none;
  background:radial-gradient(520px 340px at 12% 8%,var(--violet-s),transparent 70%),radial-gradient(520px 360px at 88% 12%,var(--rose-s),transparent 70%),radial-gradient(520px 380px at 70% 72%,var(--green-s),transparent 70%),radial-gradient(460px 320px at 22% 80%,var(--orange-s),transparent 70%),radial-gradient(420px 300px at 50% 40%,var(--blue-s),transparent 70%)}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:30px;align-items:center}
.kicker{display:inline-flex;align-items:center;gap:8px;font:500 12.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.kicker i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-s)}
.hero h1{font-size:clamp(2.7rem,7.6vw,5.9rem);font-weight:800;line-height:.93;letter-spacing:-.045em;margin:20px 0 18px}
.hero h1 .grad{background:linear-gradient(100deg,var(--violet),var(--rose) 45%,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-size:clamp(1.05rem,2vw,1.3rem);color:var(--muted);max-width:none;line-height:1.5}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:0}
.fact small{display:block;font:500 11px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fact b{font:700 17px/1.1 var(--f-head)}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border-radius:99px;font:600 15px/1 var(--f-body);text-decoration:none;border:1.5px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn:hover{transform:translateY(-1px)}
.count{display:flex;gap:8px;align-items:baseline}
.count b{font:800 clamp(2rem,4vw,3rem)/1 var(--f-head);letter-spacing:-.04em}
.count span{color:var(--muted);font-size:14px}

/* antibody figure */
.abfig{margin:0;position:relative}
.abfig svg{width:100%;height:auto;max-height:470px;display:block;overflow:visible}
.abfig .chain{fill:var(--accent)}
.abfig .chain.light{opacity:.5}
.abfig .vdom{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 4;opacity:.7}
.abfig .ag{fill:var(--surface-2);stroke:var(--muted);stroke-width:1.4}
.abfig .lead{stroke:var(--muted);stroke-width:1;fill:none}
.abfig .tie{stroke:var(--muted);stroke-width:1.4;stroke-dasharray:2 4}
.abfig .loop{cursor:pointer;stroke:var(--bg);stroke-width:2.5;transition:transform .15s,filter .15s;transform-box:fill-box;transform-origin:center}
.abfig .loop:hover,.abfig .loop.on{transform:scale(1.35);filter:drop-shadow(0 0 6px rgba(255,255,255,.5))}
.abfig .l-h1{fill:#F2711C}.abfig .l-h2{fill:#E0457B}.abfig .l-h3{fill:#FFC53D}.abfig .l-l1{fill:#16A05B}.abfig .l-l2{fill:#0B86B8}.abfig .l-l3{fill:#A56BFF}
.abfig .strand path{stroke:var(--bg);stroke-width:10;stroke-linecap:round;opacity:.3;fill:none}
.abfig .ssbar{stroke:var(--bg);stroke-width:3;stroke-linecap:round;fill:none}
.abfig .num text{font:700 12px var(--f-mono);fill:#1a1a1a;pointer-events:none}
.abfig .l-ss{fill:#FFC53D}.abfig .l-hm{fill:#16A05B}
.abfig .lbl{font:500 11px var(--f-mono);fill:var(--muted);letter-spacing:.04em}
.abfig figcaption{margin-top:8px;min-height:3.4em;font-size:14px;color:var(--muted);text-align:center;padding:0 8px}
.abfig figcaption b{color:var(--ink)}
.abfig.small svg{max-height:330px}
.figbox{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:22px;align-items:center;margin:1.2em 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.figbox ul{margin:0;padding-left:1.1em;color:var(--muted);font-size:15px}
.figbox li{margin:.35em 0}

/* sections */
.sec{padding:54px 0}
.sec h2.big{font-size:clamp(1.9rem,4.4vw,3rem);font-weight:800;letter-spacing:-.035em;margin-bottom:10px}
.sec .intro{color:var(--muted);font-size:1.12rem;max-width:none;margin-bottom:26px}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;display:block}

/* track picker */
.picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (min-width:760px){.picker{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1080px){.picker{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media screen and (max-width:520px){.picker{grid-template-columns:1fr}}
.tcard{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px 18px;text-decoration:none;color:var(--ink);overflow:hidden;transition:transform .2s,box-shadow .2s;box-shadow:var(--shadow)}
.tcard::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c)}
.tcard:hover{transform:translateY(-5px)}
.tcard .ic{width:46px;height:46px;border-radius:14px;background:var(--cs);color:var(--c);display:grid;place-items:center}
.tcard .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tcard h3{font-size:1.15rem;font-weight:700;overflow-wrap:break-word;hyphens:auto}
@media (min-width:1080px){.tcard h3{font-size:1.04rem}}
.tcard p{font-size:14.5px;color:var(--muted);margin:0;line-height:1.5}
.tcard ul{margin:2px 0 0;padding-left:1.1em;font-size:14px;color:var(--muted)}
.tcard .go{margin-top:auto;padding-top:8px;font:600 14px var(--f-body);color:var(--c);display:flex;justify-content:space-between}
.tcard .mins{font:500 11.5px var(--f-mono);color:var(--muted)}
.tcard .kn{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c);margin-top:4px;margin-bottom:-4px}
.tcard .q{font-weight:500;color:var(--ink);font-size:15px}

/* ladder */
.ladder{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.rung{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr);gap:8px 18px;align-items:center}
.rung .nm{font:600 15px/1.25 var(--f-head)}
.rung .bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.rung .bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;background:var(--col);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.rung.in .bar i{width:var(--w)}
.rung .vd{grid-column:2;font-size:14px;color:var(--muted);margin-top:-2px}
.note-s{font-size:13px;color:var(--muted);margin-top:4px}

/* directions on home */
.dirs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;position:relative;box-shadow:var(--shadow)}
.dcard .n{font:800 4rem/1 var(--f-head);letter-spacing:-.06em;color:var(--c);opacity:.9}
.dcard h3{font-size:1.2rem;margin:6px 0 8px}
.dcard p{font-size:14.5px;color:var(--muted);margin:0}

/* tables */
.tbl{overflow-x:auto;margin:1.1em 0;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;min-width:560px;font-size:14.5px}
.tbl th{position:sticky;top:0;text-align:left;font:600 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
.tbl tr:last-child td{border-bottom:0}
.tbl td.k{font-weight:600;min-width:120px}
.tbl tbody tr:hover{background:var(--accent-s)}

/* rosetta */
.rosetta .tbl td.k{font-weight:400;min-width:230px}.rosetta .tbl td:nth-child(2){color:var(--muted)}.rosetta .tbl td b{font-weight:700}

/* judging */
.judge{display:grid;gap:14px}
.jrow{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 16px;align-items:center}
.jrow .nm{font:700 1.05rem var(--f-head)}
.jrow .nm span{display:block;font:500 12px var(--f-mono);color:var(--muted)}
.jrow .bar{height:34px;border-radius:12px;background:var(--surface-2);overflow:hidden;position:relative}
.jrow .bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);border-radius:12px;display:flex;align-items:center;padding:0 12px;color:#fff;font:800 15px var(--f-head);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.jrow.in .bar i{width:var(--w)}
.jrow .q{grid-column:2;font-size:14.5px;color:var(--muted);margin-top:-2px}
body:not([data-track]) .jrow .bar i{background:linear-gradient(90deg,var(--violet),var(--rose))}
:root[data-theme="light"] .jrow .bar i{color:#fff}
.jrow:first-child .bar i{filter:saturate(1.1)}

/* track page */
.thero{position:relative;overflow:hidden;padding:44px 0 28px;background:linear-gradient(180deg,var(--accent-s),transparent)}
.thero .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
.thero .back{font:500 13px var(--f-mono);color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:16px}
.thero h1{font-size:clamp(2rem,5.4vw,3.8rem);font-weight:800;letter-spacing:-.04em;line-height:.98;max-width:none}
.thero h1 em{font-style:normal;color:var(--accent)}
.thero .tag{font-size:1.15rem;color:var(--muted);max-width:none;margin:16px 0 0;line-height:1.5}
.thero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.chip{display:inline-flex;align-items:center;gap:7px;font:500 12.5px/1 var(--f-mono);padding:8px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.chip b{color:var(--accent)}
.thero .badge{width:104px;height:104px;border-radius:30px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow)}
.thero .badge svg{width:54px;height:54px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:0 46px;padding-bottom:70px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh) + 3px);z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;gap:6px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:26px;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.toc a{flex:none;font:500 13px/1 var(--f-body);color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.toc a.on{background:var(--accent);border-color:var(--accent);color:#fff}
.toc .tl{display:none}
@media (min-width:1100px){
  .layout{grid-template-columns:230px minmax(0,1fr)}
  .toc{flex-direction:column;overflow:visible;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border:0;margin:0;padding:6px 0 0;align-self:start;height:max-content;gap:2px}
  .toc .tl{display:block;font:500 11.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 0 10px 12px}
  .toc a{border:0;background:none;border-radius:10px;padding:9px 12px;white-space:normal;line-height:1.3;display:flex;gap:10px}
  .toc a b{font:600 12px var(--f-mono);opacity:.55;flex:none;padding-top:1px}
  .toc a:hover{background:var(--surface-2)}
  .toc a.on{background:var(--accent-s);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
}
@media screen and (max-width:1099px){.toc a b{display:none}}
.chap{padding:34px 0 18px;border-top:1px solid var(--line)}
.chap:first-of-type{border-top:0;padding-top:6px}
.chap-h{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.chap-n{font:700 13px var(--f-mono);color:#fff;background:var(--accent);border-radius:10px;padding:7px 9px;letter-spacing:.04em}
.chap-h h2{font-size:clamp(1.55rem,3.2vw,2.15rem);font-weight:750;letter-spacing:-.03em}
.prose h3{font-size:1.25rem;font-weight:700;margin:1.6em 0 .6em}
.prose h4{font-size:1.02rem;margin:1.2em 0 .3em;font-family:var(--f-body);font-weight:650;letter-spacing:0}
.prose ul,.prose ol{padding-left:1.25em;margin:0 0 1.1em}
.prose li{margin:.4em 0}
.prose li::marker{color:var(--accent)}
.lead{font-size:1.16rem;line-height:1.55;color:var(--ink)}
.prose .tbl td,.prose .tbl th{hyphens:auto}

.callout{display:grid;grid-template-columns:auto 1fr;gap:14px;border-radius:16px;padding:16px 18px;margin:1.3em 0;background:var(--accent-s);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.callout>b{font:600 11.5px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);padding-top:4px;min-width:74px}
.callout div>:last-child{margin-bottom:0}
.callout.warn{background:rgba(217,154,0,.12);border-color:rgba(217,154,0,.4)}.callout.warn>b{color:#B07A00}
:root[data-theme="dark"] .callout.warn>b{color:#FFC53D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .callout.warn>b{color:#FFC53D}}

.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:1em 0}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:1.2em 0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:1.2em 0}

.dir{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 22px 8px;margin:1.4em 0;box-shadow:var(--shadow)}

.pill{display:inline-block;font:600 11.5px/1 var(--f-mono);padding:5px 8px;border-radius:7px;background:var(--accent-s);color:var(--accent)}

.next{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:20px}

/* day page */

@media screen and (max-width:560px){.partners{grid-template-columns:1fr 1fr;gap:10px}.plogo{height:68px;padding:10px 12px}.plogo img{max-height:40px}.plogo.big img{max-height:50px}.partner h3{font-size:.95rem}.partner p{font-size:12.5px}}

<body>
<div id="app"></div>
<noscript>This guide needs JavaScript to display.</noscript>
<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=(()=>{let n=0;return p=>p+(++n)})();

/* ---------- antibody figure ---------- */
const LOOPS={
  h1:['CDR-H1','Heavy-chain loop 1. Shapes the rim of the binding site.'],
  h2:['CDR-H2','Heavy-chain loop 2. Contributes contacts and helps position H3.'],
  h3:['CDR-H3','The longest, most variable loop, and usually the one doing most of the binding work.'],
  l1:['CDR-L1','Light-chain loop 1. Often contacts the edge of the antigen.'],
  l2:['CDR-L2','Light-chain loop 2. The most conserved of the six.'],
  l3:['CDR-L3','Light-chain loop 3. Pairs with H3 at the center of the paratope.'],
  c1:['CDR1 (CDR-H1)','Loop 1. Shapes the rim of the binding site.'],
  c2:['CDR2 (CDR-H2)','Loop 2. Adds contacts and helps hold CDR3 in place.'],
  c3:['CDR3 (CDR-H3)','Loop 3. Usually the longest and most variable, and in a VHH it often does most of the binding. With no light chain to share the work, it often folds back over the framework, which makes its shape hard to predict.'],
  ss:['Disulfide bond','The standard internal S–S bridge (two cysteines) that holds the fold together. Some VHHs add a second one, linking CDR3 to CDR1 or the framework. An odd number of cysteines means a free thiol.'],
  hc:['Heavy chain','The longer chain of the pair. An antibody has two identical ones. Each runs from the stem up one arm and ends in a variable domain that carries three of the six binding loops.'],
  lc:['Light chain','The shorter chain. An antibody has two identical ones, each attached to the upper half of one arm. It ends in a variable domain that carries the other three binding loops.'],
  vh:['Variable heavy domain (VH)','Sits at the tip of the heavy chain and carries three of the six binding loops (CDR-H1, H2, H3). The dashed box marks the one zoomed on the right.'],
  vl:['Variable light domain (VL)','Pairs with VH and carries the other three loops (CDR-L1, L2, L3). A VHH has no light chain, so it has no VL.'],
  ch1:['Constant heavy domain (CH1)','Scaffold below VH. With VH, VL and CL it forms the Fab arm. Not part of the binding site.'],
  cl:['Constant light domain (CL)','Scaffold below VL. Completes the Fab arm.'],
  hss:['Hinge disulfide bonds','Disulfide bonds (yellow) between the two heavy chains at the hinge hold the two halves of the antibody together while leaving the arms free to swing.'],
  lss:['Light–heavy disulfide bond','A disulfide bond (yellow) between CL and CH1 locks each light chain to its heavy chain.'],
  fab:['Fab','One antigen-binding arm: heavy- and light-chain variable domains plus the adjacent constant domains (CH1 and CL). Adaptyv can test this format.'],
  scfv:['scFv','Heavy- and light-chain variable domains linked into one polypeptide chain by a short flexible linker. Adaptyv can test this format.'],
  vhh:['VHH domain (the nanobody)','The variable domain of a heavy-chain-only antibody. One domain of about 110 to 130 amino acids carries all three CDR loops and recognizes the target on its own, with no light chain.'],
  hg:['Hinge','The flexible linker between the Fab arms and the Fc stem. It lets the two arms swing to reach targets at different distances.'],
  fc:['Fc stem (CH2 and CH3)','Constant heavy domains. They talk to the rest of the immune system and set half-life, but do not bind the target.'],
  fw:['Framework','The conserved beta strands (the flat arrows) that make the scaffold. Same fold in every antibody: the three CDR loops sit on top and carry the specificity.'],
  hm:['Hallmark residues','A few framework-2 positions that, in a normal antibody, face the light chain and are oily. In a VHH they are typically swapped for more water-friendly residues, so the domain stays soluble on its own.']
};
Object.assign(LOOPS,{
  m_ng:['NG: asparagine deamidation','Asparagine converts to a different residue. Introduces charge heterogeneity. Best avoid in CDRs.'],
  m_gs:['N-x-S/T (x is not P): N-glycosylation sequon','Cells may attach a sugar here, which gives a mixture of molecules. Best avoid in CDRs.'],
  m_w:['W in a CDR: oxidation','Tryptophan (and methionine) can be oxidised. Best avoid in CDRs.'],
  m_dg:['DG: aspartate isomerization','Aspartate forms an isomer. Alters backbone structure and reduces affinity. Best avoid in CDRs.'],
  m_dp:['DP: acid-labile Asp–Pro bond','The chain can break at low pH. Mostly a formulation and low-pH-step concern.'],
  m_m:['M in a CDR: oxidation','Methionine can be oxidised. Best avoid in CDRs.'],
  m_c:['Unpaired C: free thiol','Scrambling and aggregation. A VHH has one standard disulfide, so 2 C. Some have a second one linking CDR3 to CDR1 or the framework, so 4 C. An odd number means a free thiol.'],
  m_h:['Long hydrophobic stretch','Oily patches promote aggregation, polyreactivity and viscosity. Look at the surface, not just the string.'],
  m_p:['Long positively charged stretch','Clusters of K and R promote polyreactivity and viscosity. Look at the surface, not just the string.'],
  ag:['Antigen','The target: the molecule you want the binder to stick to. It is usually a protein.'],
  bd:['Binder (here a VHH)','The antibody or VHH. Only its tip touches the target; the rest of the molecule is scaffold.'],
  pp:['Paratope','The patch on the binder that does the touching. It is made of the CDR loops.'],
  ep:['Epitope','The patch on the antigen that the binder touches. Here it covers the surface the target uses to do its job, so a binder sitting on it can block that job.'],
  ep2:['A second, non-overlapping epitope','The same target can be bound at other places. Which patch you aim for matters: you may want to cover the surface the target uses for a function you want to block, or to avoid that surface.'],
  seq:['Far apart in sequence, close together in 3D','An epitope can be formed by amino acids that are far apart along the chain but meet on the folded surface. The binder sees the folded shape, not the sequence.'],
  kdp:['KD in the picomolar range (10⁻¹² M)','Very tight. Half of the binder is occupied even at a vanishingly low concentration of target.'],
  kdn:['KD in the nanomolar range (10⁻⁹ M)','Tight. The normal range for therapeutic antibodies.'],
  kdu:['KD in the micromolar range (10⁻⁶ M)','Quite weak. A thousand times more target is needed to occupy half of the binder than at nanomolar KD.']
});
function abParts(){
  const arm=(side)=>{
    const s=side==='L'?-1:1;
    const tx=side==='L'?192:208, rot=side==='L'?-32:32;
    const lx=s*-1*(side==='L'?1:-1); // placeholder
    const lightX=side==='L'?-50:22;
    const lp=side==='L'?{l1:-42,l2:-20,l3:-31}:{l1:30,l2:42,l3:36}; // not used directly
    const L={l1:side==='L'?-43:43,l2:side==='L'?-20:20,l3:side==='L'?-32:32};
    const H={h1:side==='L'?-9:9,h2:side==='L'?9:-9,h3:0};
    return `<g transform="translate(${tx} 246) rotate(${rot})">
      <rect class="chain dom" data-k="hc" x="-16" y="-200" width="32" height="205" rx="15"/>
      <rect class="chain light dom" data-k="lc" x="${lightX}" y="-200" width="28" height="125" rx="13"/>
      <rect class="vdom" x="${side==='L'?-54:-20}" y="-206" width="74" height="64" rx="22"/>
      <circle class="loop l-l1" data-k="l1" cx="${L.l1}" cy="-207" r="7"/>
      <circle class="loop l-l2" data-k="l2" cx="${L.l2}" cy="-207" r="7"/>
      <circle class="loop l-l3" data-k="l3" cx="${L.l3}" cy="-217" r="8"/>
      <circle class="loop l-h1" data-k="h1" cx="${H.h1}" cy="-207" r="7"/>
      <circle class="loop l-h2" data-k="h2" cx="${side==='L'?10:-10}" cy="-207" r="7"/>
      <circle class="loop l-h3" data-k="h3" cx="0" cy="-219" r="10"/>
    </g>`;
  };
  const inner=`
    <g class="chain"><rect class="dom" data-k="hc" x="170" y="240" width="28" height="150" rx="14"/><rect class="dom" data-k="hc" x="202" y="240" width="28" height="150" rx="14"/></g>
    <path class="ag" d="M30 40c4-22 30-30 46-16 18 3 26 22 12 36-10 14-34 14-46 4-8-6-14-14-12-24z"/>
    <path class="ag" d="M370 40c-4-22-30-30-46-16-18 3-26 22-12 36 10 14 34 14 46 4 8-6 14-14 12-24z"/>
    <path class="tie" d="M62 62L70 76M338 62L330 76"/>
    ${arm('L')}${arm('R')}
    <text class="lbl" x="48" y="14">antigen</text><text class="lbl" x="318" y="14">antigen</text>
    <text class="lbl" x="200" y="414" text-anchor="middle">Fc (the stem)</text>
    <path class="lead" d="M240 318L231 318M316 190L298 176"/>
    <text class="lbl" x="244" y="322">heavy chain</text><text class="lbl" x="320" y="194">light chain</text>
  `;
  return inner;
}
function abFigure(cls=''){
  return `<figure class="abfig ${cls}">
   <svg viewBox="0 0 400 430" role="img" aria-label="Stylised IgG antibody: a Y shape with six binding loops, the CDRs, at each tip">
${abParts()}   </svg>
   <figcaption><b>Hover or tap a loop or chain</b><span class="cd">Six CDRs sit at each tip. Everything else is framework.</span></figcaption>
  </figure>`;
}

function kdWidget(){

   <div class="rowN">
    <div><label>KD</label><div class="row2"><input type="number" class="kdv" value="1" min="0" step="any" inputmode="decimal"><select class="kdu"><option value="1e-12">pM</option><option value="1e-9" selected>nM</option><option value="1e-6">µM</option></select></div>
     <div class="presets"><button data-v="100" data-u="1e-12">100 pM</button><button data-v="1" data-u="1e-9">1 nM</button><button data-v="100" data-u="1e-9">100 nM</button><button data-v="1" data-u="1e-6">1 µM</button></div></div>
    <div><label>Temperature (K)</label><input type="number" class="kt" value="298.15" step="1"><label>ΔΔG of a mutation (kcal/mol)</label><input type="number" class="ddg" value="-0.4" step="0.1"></div>
   </div>
   <div class="out"><div class="o"><small>ΔG binding</small><b class="dg">—</b></div><div class="o"><small>RT</small><b class="rt">—</b></div><div class="o"><small>1 decade of KD =</small><b class="dec">—</b></div><div class="o"><small>That ΔΔG changes KD by</small><b class="fold">—</b></div></div>
   <div class="small-note">Sanity check: a 5 kcal/mol gain from one point mutation is more than three orders of magnitude in KD. It happens, rarely. And assay repeats often differ by a few tenths of a kcal/mol, which is already a factor of 1.5 to 2.</div>
  </div>`;
}
function mountKd(w){
  const q=s=>$(s,w);
  const R=0.0019872041;
  const calc=()=>{
    const v=parseFloat(q('.kdv').value),u=parseFloat(q('.kdu').value),T=parseFloat(q('.kt').value)||298.15,d=parseFloat(q('.ddg').value);
    const RT=R*T; q('.rt').textContent=RT.toFixed(3)+' kcal/mol'; q('.dec').textContent=(RT*Math.LN10).toFixed(2)+' kcal/mol';
    q('.dg').textContent=(v>0&&u>0)?(RT*Math.log(v*u)).toFixed(1)+' kcal/mol':'—';
    if(isFinite(d)){const f=Math.exp(d/RT);q('.fold').textContent=(f>=1?'×'+f.toFixed(2)+' weaker':'×'+(1/f).toFixed(2)+' tighter')}else q('.fold').textContent='—';
  };
  $$('input,select',w).forEach(i=>i.addEventListener('input',calc));
  $$('.presets button',w).forEach(b=>b.addEventListener('click',()=>{q('.kdv').value=b.dataset.v;q('.kdu').value=b.dataset.u;calc()}));
  calc();
}

  const f=(pH,pKa)=>1/(1+Math.pow(10,pH-pKa));

  const draw=()=>{
    const pKa=parseFloat(sl.value);$('.pkav',w).textContent=pKa.toFixed(1);
    let d='';for(let p=4.5;p<=8.51;p+=.05){d+=(d?'L':'M')+X(p).toFixed(1)+' '+Y(f(p,pKa)).toFixed(1)}
    const pts=[[7.4,'7.4'],[6.7,'6.7'],[5.75,'5.5–6.0']];
    svg.innerHTML=`<rect class="band" x="${X(5.5)}" y="20" width="${X(6.0)-X(5.5)}" height="160" rx="4"/>
     <line class="axis" x1="40" y1="180" x2="500" y2="180"/><line class="axis" x1="40" y1="20" x2="40" y2="180"/>
     ${[4.5,5.5,6.5,7.5,8.5].map(p=>`<text x="${X(p)}" y="198" text-anchor="middle">${p}</text>`).join('')}
     <text x="12" y="26">1</text><text x="12" y="184">0</text><text x="270" y="209" text-anchor="middle">pH</text>
     <path class="curve" d="${d}"/>
     ${pts.map(([p,l])=>`<circle class="pt" cx="${X(p===5.75?5.75:p)}" cy="${Y(f(p,pKa))}" r="5"/>`).join('')}`;
    $('.f74',w).textContent=Math.round(f(7.4,pKa)*100)+'%';
    $('.f67',w).textContent=Math.round(f(6.7,pKa)*100)+'%';
    $('.f58',w).textContent=Math.round(f(6.0,pKa)*100)+'–'+Math.round(f(5.5,pKa)*100)+'%';
  };
  sl.addEventListener('input',draw);draw();
}

const SAMPLE='QVQLQESGGGLVQAGGSLRLSCAASGRTFSSYAMGWFRQAPGKEREFVAAISWSGGSTYYADSVKGRFTISRDNAKNTVYLQMNSLKPEDTAVYYCAADLNGSYYDGDPMRSNYTYDYWGQGTQVTVSS';
function scanWidget(){
  return `<div class="wgt" data-w="scan">
   <h4>Liability motif scanner</h4>
   <div class="sub">Paste a VHH sequence (one-letter codes). The prefilled example is made up: a generic llama-style VHH framework (note the hallmark stretch KEREF) with an invented CDR3 stuffed with liabilities. This is a plain string scan, nothing more.</div>
   <textarea class="seq" spellcheck="false" aria-label="Amino acid sequence">${SAMPLE}</textarea>
   <div class="seqout" aria-live="polite"></div>
   <div class="legend"><span><i class="m-ng"></i>NG deamidation</span><span><i class="m-dg"></i>DG isomerization</span><span><i class="m-dp"></i>DP acid-labile</span><span><i class="m-gl"></i>N-x-S/T glycosylation</span><span><i class="m-ox"></i>M / W oxidation</span><span><i class="m-c"></i>Cysteine</span></div>
   <div class="out scanout"></div>
   <div class="small-note">Positions are raw 1-based indices into what you pasted, <b>not</b> IMGT or Kabat numbers. That mismatch is the silent bug the numbering section warns about. A motif matters mainly in or near a CDR and when solvent-exposed, so run ANARCI to find the three CDRs before panicking.</div>
  </div>`;
}
function mountScan(w){
  const ta=$('.seq',w),out=$('.seqout',w),sum=$('.scanout',w);
  const run=()=>{
    const s=ta.value.toUpperCase().replace(/[^A-Z]/g,'');
    const cls=new Array(s.length).fill('');
    const mark=(re,c)=>{let m;while((m=re.exec(s))){for(let i=0;i<m[0].length;i++){if(!cls[m.index+i])cls[m.index+i]=c}re.lastIndex=m.index+1}};
    const cnt={ng:0,dg:0,dp:0,gl:0,ox:0};
    const count=(re)=>{let n=0,m;while((m=re.exec(s))){n++;re.lastIndex=m.index+1}return n};
    cnt.ng=count(/NG/g);cnt.dg=count(/DG/g);cnt.dp=count(/DP/g);cnt.gl=count(/N(?=[^P][ST])/g);cnt.ox=count(/[MW]/g);
    const nC=(s.match(/C/g)||[]).length;
    mark(/NG/g,'m-ng');mark(/DG/g,'m-dg');mark(/DP/g,'m-dp');mark(/N(?=[^P][ST])[^]{3}/g,'m-gl');mark(/[MW]/g,'m-ox');mark(/C/g,'m-c');
    let html='',i=0;while(i<s.length){const c=cls[i];let j=i;while(j<s.length&&cls[j]===c)j++;html+=c?`<mark class="${c}">${s.slice(i,j)}</mark>`:s.slice(i,j);i=j}
    out.innerHTML=html||'<span style="color:var(--muted)">Paste a sequence above</span>';
    const pos=(re)=>{const a=[];let m;while((m=re.exec(s))){a.push(m.index+1);re.lastIndex=m.index+1}return a.join(', ')||'none'};
    sum.innerHTML=[
      ['NG',pos(/NG/g)],['DG',pos(/DG/g)],['DP',pos(/DP/g)],['N-x-S/T',pos(/N(?=[^P][ST])/g)],['M / W',cnt.ox+' residues'],
      ['Cysteines',nC+(nC===2?' (the one standard disulfide)':nC===4?' (two disulfides: the standard one plus an extra, which some VHHs have)':nC%2?' (odd, so at least one free thiol; check)':nC?' (check against what you expect)':'')]
    ].map(([a,b])=>`<div class="o"><small>${a}</small><b style="font-size:1rem">${b}</b></div>`).join('');
  };
  ta.addEventListener('input',run);run();
}

/* ---------- reveal / bars / progress ---------- */
function observeReveals(root=document){
  const els=$$('.reveal,.rung,.jrow',root);
  if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
  els.forEach(e=>io.observe(e));
}
function mountAll(root){
  $$('[data-widget]',root).forEach(h=>{
    const k=h.dataset.widget;
    const html={ab:()=>abFigure('small'),epi:()=>epiFigure('small wide'),motif:()=>motifFigure('small'),aff:()=>affFigure('small wide'),trio:()=>abFigure('small f1')+structFigure('small f2')+zoomFigure('small f3'),fam:famWidget,vhh:()=>vhhFigure('small'),kd:kdWidget,ph:phWidget,scan:scanWidget}[k];
    if(!html)return; h.innerHTML=html(); if(k==='trio')h.classList.add('tri');
    if(h.dataset.ptag&&k!=='trio')$('.abfig',h).insertAdjacentHTML('afterbegin',`<span class="ptag-h">${h.dataset.ptag}</span>`);
    if(h.dataset.ptag&&k==='trio')$$('.abfig svg',h).forEach((sv,i)=>{const t=h.dataset.ptag[i];if(!t)return;const vb=sv.viewBox.baseVal,x=vb.x+vb.width-16,y=vb.y+17;sv.insertAdjacentHTML('beforeend',`<g class="ptag"><circle cx="${x}" cy="${y}" r="11"/><text x="${x}" y="${y+4.5}" text-anchor="middle">${t}</text></g>`)});

    if(k==='kd')mountKd(w);if(k==='ph')mountPh(w);if(k==='scan')mountScan(w);if(k==='ab'||k==='vhh'||k==='trio'||k==='epi'||k==='aff'||k==='motif')mountAb(h);if(k==='fam')mountFam(h);
  });
}

function mountGloss(root){

}

const standin=rows=>`<div class="sti"><div class="sti-h" aria-hidden="true"><span>In the lab</span><span></span><span>On the computer</span><span>How good is it?</span></div>${rows.map(([l,ld,c,n,lab,t])=>`<div class="sti-r ${n>=4?'g':n>=2?'m':'b'}"><div class="sti-l"><b>${l}</b><small>${ld}</small></div><div class="sti-a" aria-hidden="true">→</div><div class="sti-c">${c}</div><div class="sti-q"><div class="sti-top"><b>${lab}</b><span class="sti-d" role="img" aria-label="${n} out of 5">${[1,2,3,4,5].map(i=>`<i${i<=n?' class="on"':''}></i>`).join('')}</span></div>${t?`<p>${t}</p>`:''}</div></div>`).join('')}</div>`;
const tbl=(head,rows)=>`<div class="tbl"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' class="k"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const callout=(kind,label,html)=>`<aside class="callout ${kind}"><b>${label}</b><div>${html}</div></aside>`;
const terms=(rows,cls='')=>`<dl class="terms ${cls}">${rows.map(([t,d])=>`<div><dt>${t}</dt><dd>${d}</dd></div>`).join('')}</dl>`;
const funnel=rows=>`<div class="fn">${rows.map(([t,d,big,small,chip,ext,tw,bw],i)=>{const l1=(100-tw)/2,l2=(100-bw)/2;return `<div class="fnr${ext?' ext':''}" style="--k:${i}"><div class="fns" style="clip-path:polygon(${l1}% 0,${100-l1}% 0,${100-l2}% 100%,${l2}% 100%)"><b>${big}</b><small>${small}</small></div><div class="fnt"><span class="chip">${chip}</span><h4><i>${i+1}</i>${t}</h4><p>${d}</p></div></div>`}).join('')}</div>`;
const steps=(rows,hot,loop)=>`<div class="steps${loop?' wf':''}">${rows.map(([t,d,chip,ext],i)=>`<div class="step${hot===i?' hot':''}${ext?' ext':''}">${chip?`<span class="chip">${chip}</span>`:''}<h4>${t}</h4><p>${d}</p></div>${loop&&i===loop.after?`<div class="loopbar"><span>${loop.text}</span></div>`:''}`).join('')}</div>`;
const cards=(rows)=>`<div class="cards">${rows.map(([t,d],i)=>`<div class="card"><span class="num">${String(i+1).padStart(2,'0')}</span><h4>${t}</h4><p>${d}</p></div>`).join('')}</div>`;
const check=(items)=>`<ul class="check">${items.map(i=>`<li><span>${i}</span></li>`).join('')}</ul>`;
const dir=(n,title,body)=>`<div class="dir"><span class="n">${n}</span><h3>${title}</h3>${body}</div>`;
const sci=(b,e)=>`${b}×10<sup>${e}</sup>`;

const CRIT=[
  ['Judgment',40,'Are the decisions principled? What does it change, how does it score, when does it stop?'],
  ['Execution',20,'Does it run unattended on something unseen and get somewhere sensible?'],
  ['User fit',20,'Who is the user, what pain is mitigated, how costly is that pain?'],
  ['Path to value',20,'How do you get from prototype to real use, and how is that funded?']
];
const judging=()=>`<div class="judge">${CRIT.map(([n,w,q])=>`<div class="jrow" style="--w:${w*2.2}%"><div class="nm">${n}<span>${w}% of score</span></div><div class="bar"><i>${w}%</i></div><div class="q">${q}</div></div>`).join('')}</div>`;


const MODELS=[
  ['OpenFold3','Open AlphaFold3-class complex prediction','Fully open; the organizers also provide it directly'],
  ['RoseTTAFold3','RoseTTAFold-line, AlphaFold3-class complex prediction',''],
  ['Boltz-2','Structure plus binding affinity','The affinity head is trained on protein–<b>small-molecule</b> data. It is not a VHH–antigen (or antibody–antigen) affinity predictor.'],
  ['OpenDDE','Protein and antibody–antigen complexes','Has an antibody–antigen-tuned checkpoint. Its authors report large gains over AlphaFold3 on antibody–antigen interfaces; those are self-reported benchmarks, and it is worth checking whether they include nanobodies, so test it.'],
  ['Protenix-v2','All-atom complex prediction','Another independent co-folding model: useful for consensus'],
  ['OpenBind-0','Protein–ligand, co-folded','Small-molecule oriented'],
  ['ESMFold-2','Rapid single-sequence folding','Fast first look, no MSA'],
  ['AF2-IG','Scores a binder you already designed','AlphaFold2 “initial guess” re-scoring'],
  ['BoltzGen · RFdiffusion3 · PXDesign','De novo binder and backbone design','Generate candidates; you still have to filter them'],
  ['ESMC · SaProt','Sequence and structure-aware embeddings','Features for your own models and baselines']
];
const modelTable=()=>tbl(['Model on JapanFold','What it does','Heads-up'],MODELS);
const jfNote=`JapanFold’s public workbench is a free demo on shared compute with caps: <b>1,024 residues per structure, 10 structures per run, 10 binders per design</b>. A VHH–antigen complex with a large antigen can exceed that, so crop the antigen to the region around your epitope, or use the API.`;

SH.intro=()=>`<div class="prose">
  <p class="lead">No. You do not need to be an expert in anything to take part. Teams are mixed on purpose: biologists, programmers, chemists, clinicians, business people and curious newcomers.</p>

SH.basics=()=>`<div class="prose">
  <h3>What are proteins?</h3>
  <p>${L('https://youtu.be/DdNv8VtXjRg','A short video on protein folding')} explains it best. In summary:</p>
  <p>Proteins are chains of amino acids that fold into three-dimensional structures. There are 20 common amino acids (the building blocks), each written as a single letter. A sequence might look like this:</p>
  <div class="codeblock" aria-label="Example amino-acid sequence">${EX_SEQ}</div>
  <p>Different sequences can fold into different 3D structures and therefore have different functions. Changing one amino acid may alter a protein’s properties, though many changes have little effect.</p>
  ${terms([
   ['Residue','One amino acid at one position in a chain. People use “residue 97” and “position 97” interchangeably.'],
   ['Mutation','Here, we mean a deliberate substitution such as “N55A”. Read as: at position 55, the amino acid asparagine (N) was replaced with alanine (A).'],
   ['Chain','One continuous line of amino acids. A structure file often holds several chains, labeled A, B, C, etc. They can be different proteins fulfilling different functions, or parts of one protein complex.']
  ])}
  ${more('Two more ideas, if you are new to this',`<ul><li>The <b>shape does the work</b>: a protein's fold decides what it does, which is why a small change at the right place makes a huge difference and elsewhere often does not.</li><li><b>Proteins are fussy.</b> In nature, they must be made by cells and stay stable and soluble, which is  addressed in the developability section further down.</li></ul>`)}

  <h3>How do I find a protein structure?</h3>
  <p>The best option is to check whether your protein of interest has an experimentally determined structure. One primary database is the ${L('https://www.rcsb.org/','Protein Data Bank (PDB)')}. Its search results can include many structures of the same protein. ${L('https://www.uniprot.org/','UniProt')} helps you find the protein entry and links to available structures.</p>
  <p>Let’s find a protein called albumin as an example:</p>
  ${steps([
   ['Search UniProt','Go to '+L('https://www.uniprot.org/','UniProt')+'. Type “albumin”, select “Human”, and look for the 3D structure filter.','UniProt'],
   ['Open the entry','Choose the human serum albumin entry ('+L('https://www.uniprot.org/uniprotkb/P02768/entry','P02768')+'), select the structure section, and you will see the available structures.','UniProt'],
   ['Read the list','You can see that there are multiple X-ray structures. For X-ray structures, a lower resolution value in Å generally means finer structural detail. Values below 2 Å are often good, but resolution alone does not determine structure quality.','Resolution'],
   ['Download and view','Open a structure’s '+L('https://www.rcsb.org/','PDB')+' identifier and choose the mmCIF file. Structures can be visualized using PyMOL or ChimeraX. Claude Science can also do that for you.','PDB']
  ])}

  <h3>What is an antibody?</h3>
  <p>An antibody is a protein your immune system makes to stick to another, very specific protein and hold on to it. By doing so, the antibody keeps the protein from interacting with the body and/or helps the immune system respond to it. Antibodies can “recognize” foreign proteins from viruses, bacteria, and many other unwelcome guests, but also proteins your own body produces. Your immune system makes antibodies by the billion, each able to potentially recognize a different protein.</p>
  <p> We call proteins recognized by antibodies <b>antigens</b> (i.e., their targets), and the interaction between them <b>binding</b>. An antibody binds its antigen at a very specific place, too. That specificity is why antibodies became drugs. If you can make an antibody that binds, for example, a protein found on cancer cells and nowhere else, you can fight the cancer without harming the body. <b>Antibody engineering</b> is exactly this: taking an antibody that sticks and making it stick “better,” survive manufacturing and behave in a human body.</p>

  <h3>Which part of an antibody recognizes its antigen?</h3>
  <p>An antibody is shaped like the letter Y (Figure 1A; hover over or tap a loop or chain to see its name). It is built from four chains, each a long string of amino acids: two identical <b>heavy chains</b> and two identical <b>light chains</b> (“heavy” and “light” simply refer to their size). Each chain folds into compact pieces called <b>domains</b>, drawn as ovals in Figure 1A. Figure 1B shows the same architecture in a real 3D structure.</p>
  <p>Recognition happens only at the two tips of the Y. Each tip is formed by a pair of <b>variable domains</b>, one from a heavy chain and one from a light chain, so called because their sequences differ the most from one antibody to the next. The rest of the molecule is made of <b>constant domains</b>, which are nearly identical in every antibody: they hold the Y together and signal to the immune system, but they do not choose the target. The four colors in Figure 1B mark the variable heavy, variable light, constant heavy and constant light domains.</p>
  <p>Within each variable domain, three short <b>loops</b> (stretches of the chain that stick out from the fold) reach toward the antigen. These are the <b>complementarity-determining regions</b>, or <b>CDRs</b>: their shapes <i>complement</i> the antigen’s, and they <i>determine</i> what the antibody binds. They are numbered CDR1, CDR2 and CDR3 along the chain, so each tip carries six CDRs in total, three from the heavy and three from the light variable domain. Figure 1C zooms in on the boxed heavy-chain variable domain from Figure 1B and shows its three loops.</p>
  <p>Everything in a variable domain that is not a CDR is called the <b>framework</b>: the rigid scaffold, mostly flat strands packed like a sandwich (blue in Figure 1C), that holds the three loops in position. Frameworks are fairly similar from one antibody to the next, while CDR sequences differ a lot, which is how billions of different antibodies share the same overall shape. The heavy-chain <b>CDR3</b> is usually the longest and most variable loop and often plays the most important role, but CDR1, CDR2, the light-chain loops and the nearby framework residues can also touch the antigen.</p>
  <div data-widget="trio" data-ptag="ABC"></div>
  <p class="figcap"><b>Figure 1. An antibody at three levels of detail.</b> (A) Schematic of an antibody: two heavy chains (dark, running from the stem to the tips) and two light chains (pale, on the arms), with their binding loops. (B) A real antibody structure (PDB entry 1IGY), colored by domain type. (C) Zoom on one heavy-chain variable domain: the three CDR loops (CDR1 gold, CDR2 teal, CDR3 plum) held in place by the framework (blue).</p>

  <h3>From antibody to VHH</h3>
  <p>The binding happens at the very tips, and the tips are what this hackathon is about. Camelids (llamas, alpacas and camels) also make a slimmer kind of antibody with <b>no light chains</b>, whose tip is a single small domain (Figure 2B). Cut that domain out and you have a <b>VHH</b> (Variable Heavy), also called a <b>nanobody</b> (Figure 2C): about 120 amino acids and 15 kDa, roughly a tenth of an IgG (the standard antibody shown in Figure 2A), that still binds on its own. <b>The challenge centers on a VHH bound to its antigen</b>, so from here on this guide is about that molecule.</p>
  <div data-widget="fam"></div>
  <p class="figcap"><b>Figure 2. From antibody to VHH.</b> (A) A conventional antibody (IgG): four chains, six binding loops per tip. (B) A camelid heavy-chain antibody: two heavy chains and no light chain, so each tip is a single domain with three loops. (C) The VHH on its own, as a schematic and as a real structure with its three CDRs and the framework.</p>

  <h3>Why a VHH is a friendly design problem</h3>
  <ul>
   <li><b>One chain, one short sequence.</b> The whole binder is a single string of roughly 120 letters, with no heavy–light pairing to get right.</li>
   <li><b>Three loops do the binding.</b> CDR3 is usually the longest and most variable and often does most of the work, sometimes reaching into grooves a larger antibody cannot enter.</li>
   <li><b>Small, and often sturdy.</b> VHHs can often be made in bacteria or yeast. Being small also means the kidneys clear a bare VHH within hours, so half-life is something you design in.</li>
  </ul>
  <h3>What is an epitope, and what is affinity?</h3>
  <p>Binding is a meeting of two surfaces (Figure 3A). The <b>epitope</b> is the patch on the antigen that gets touched, and the <b>paratope</b> is the patch on the antibody or VHH that does the touching. How strongly they stick is the <b>affinity</b> (Figure 3B, described below). ${L('https://youtu.be/ptnjKYEEheo?t=163','A short video on CDRs')} also covers epitopes.</p>
  <div class="duo"><div data-widget="epi" data-ptag="A"></div><div data-widget="aff" data-ptag="B"></div></div>
  <p class="figcap"><b>Figure 3. Epitope, paratope and affinity.</b> (A) A binder touches only a small patch of its antigen, the epitope; the same antigen can have other epitopes, and an epitope can be made of residues that are far apart in the sequence. (B) The scale of KD: lower values mean tighter binding.</p>
  <p>Epitopes can be formed by amino acids that are far apart in sequence but close together in the 3D structure. A target can also have several non-overlapping epitopes, and the one you choose to aim at matters: you might want the binder to cover the surface the target uses for a function you want to block, or to avoid that surface.</p>
  <p><b>Affinity</b> is the strength of that binding. The standard number is the dissociation constant, <b>KD</b>, measured in units of concentration: the concentration of target at which half of the binder is occupied. <b>Lower KD means tighter binding.</b></p>
  <p>We treat a KD as true only if it was measured experimentally, by SPR or BLI. Computationally we can try to predict it, but there is so far no universally good method. You can still try if you have data similar to yours. The <a href="#toolbox">Toolbox</a> has a KD ⇄ ΔG calculator.</p>

  <h3>Vocabulary</h3>
  <p>The important names and concepts from this section, in one place, for when a talk or a paper throws one at you.</p>
  ${terms([
   ['Antibody · binding','A protein the immune system makes to recognize one specific target and stick to it · that sticking.'],
   ['Heavy chain · light chain','The two kinds of chain in a conventional antibody, two of each, joined into a Y. The heavy chain is the longer one and runs from the stem to a tip; the light chain is shorter and sits on an arm.'],
   ['Domain','A compact piece of a chain that folds on its own, drawn as an oval in the schematics.'],
   ['Variable · constant domains','The domains at the tips, whose sequences differ most between antibodies and which do the recognizing · the rest, nearly identical in every antibody, which hold the Y together and signal to the immune system.'],
   ['VH, VL','The variable domains of the heavy and light chain, roughly 110–130 amino acids each, with the immunoglobulin fold (a beta sandwich with an internal disulfide). A pair forms one tip, and almost all engineering happens here.'],
   ['CDRs · framework','Complementarity-determining regions: three loops per variable domain, six per tip, forming the binding surface. CDR-H3 is the longest, most variable and most important · the framework is the conserved scaffold holding them in place.'],
   ['Antigen · epitope · paratope','The thing being bound · the exact patch on it that gets touched · the patch on the antibody that touches it.'],
   ['Affinity · KD','How strongly a binder sticks · the number we quote for it: the concentration of antigen at which half the binder is occupied. Lower KD means tighter binding.'],
   ['Fv · Fab · Fc · scFv','The minimal binding unit (VH + VL) · the whole arm · the stem · VH and VL fused into one chain with a linker. A VHH does the job of an Fv with a single VH-like domain.'],
   ['VHH / nanobody','A camelid antibody with no light chain: one domain, ~120 amino acids, three CDRs, ~15 kDa. Cheaper to make and easier to model. “Nanobody” is a trademark of Ablynx, a Sanofi company; “VHH” and “single-domain antibody” are the generic terms, and people use all three loosely.'],
   ['Hallmark residues','A few framework-2 positions that, in a normal antibody, face the light chain. In a VHH they are typically replaced by more water-friendly residues, so the domain stays soluble alone. Changing them back is risky.'],
   ['Germline','The inherited sequence before the immune system mutates it. More germline-like usually means safer and better behaved.']
  ])}

</div>`;

SH.workflow=()=>`<div class="prose">
  <p>Design works like a <b>funnel</b>: you start with many candidates and narrow them down to a few. <b>In the hackathon you do steps 1 to 3</b>, and end with up to 10 designs to present. Step 4 is not part of your work: after you submit your selection, Adaptyv helps test selected designs in the lab.</p>
  ${funnel([
   ['Generate','VHH (or antibody) candidate sequences or structures, either by changing an existing binder or designing a new one from scratch. Usually people generate hundreds or more.','100s+','candidates','You do this',false,100,80],
   ['Score','Candidates are scored with structure-, interface- or affinity-related ML models, to pick designs that will likely have desirable properties. The weakest drop out.','ranked','weakest drop out','You do this',false,80,56],
   ['Filter','Choose which candidates to test, judging them on more than affinity: this is where developability enters. Select up to 10 to present during the hackathon. You might make them very similar to each other or very different.','≤ 10','to present','You do this',false,56,32],
   ['Test','The selected designs are tested experimentally by Adaptyv, not by you. We can probably test five designs per team. Results would feed the next round of a real campaign, but there is no lab loop on the day.','~5','tested','Adaptyv, afterwards',true,32,22]
  ])}
  <p>Every step throws candidates away, so <b>start wide</b>.</p>
  <p>Computational scores help decide what to test, but <b>they do not establish that a candidate binds</b>. A useful workflow combines <a href="#mlhelp">model predictions</a>, <a href="#mlhelp">interface scores</a> and <a href="#beyond">developability checks</a>.</p>
  <p>In the hackathon you can explore different ways of generating and ranking designs. <b>Record your inputs, model versions and the reasons for selecting each candidate.</b></p>
  <div class="callout stack"><b>Why you cannot brute-force it</b><div><p>A single CDR3 of 15 residues has 20<sup>15</sup> possibilities, about ${sci(3,19)}. Nature searches that space with billions of cells over rounds of mutation and selection. You get one day, and scoring functions correlate with reality far less well than anyone would like.</p></div></div>
</div>`;

  ${mlmap([
   ['No experimental structure of a protein (antibody or target)','Structure prediction and co-folding','seq','sequence','str','structure',['AlphaFold2/3','OpenFold','NanoBodyBuilder2','ABodyBuilder3','Boltz-2','Chai-1','ESMFold-2']],

   ['Predict binding (KD)','Regression on sequence or structure','cplx','complex','kd','number',['AF-IG2','OpenDDE','related affinity models'],'Complex-confidence scores from AlphaFold-style methods are useful for ranking but are not KD estimates. With a suitable experimental dataset, you can train your own regressor or classifier.'],
   ['Turn a sequence into numbers (embeddings) to train your own ML model','Sequence encoding','seq','sequence','vec','embedding',['ESMC','SaProt','ESM-2','nanoBERT','IgBERT'],'Simple one-hot encoding can also work well.'],
   ['Screen developability','Property prediction','seq','sequence','prop','flags',['TNP (for VHHs)'],'Predictions require experimental follow-up.']
  ])}
  <p><b>Folding</b> takes amino-acid sequences and predicts a structure. <b>Co-folding</b> takes multiple components and predicts a complex. A predicted complex does not prove that the two proteins bind, but some studies show weak correlations.</p>
  <p>The planned tools include <a href="#tools">JapanFold, Nebius, Apheris Foundry and AMASS</a>. Model access and versions will be confirmed before the event.</p>
  <h3>What do model scores mean?</h3>
  ${scmap([
   ['pLDDT','plddt','Confidence in the locally predicted structure','0–100 · higher is better'],
   ['PAE','pae','Predicted error in the relative positioning of residues','in Å · lower is better'],
   ['ipTM','iptm','Confidence in the relative placement of chains in a complex','0–1 · higher is better'],
   ['ipSAE','ipsae','An interface-focused score derived from predicted aligned error; implementations vary','0–1 · higher is better']
  ])}
  <p>Scores can help filter candidates, but <b>a high interface score does not mean high measured affinity</b>. Inspect contacts, clashes and whether a candidate binds the intended epitope. For a longer discussion, see ${L('https://www.asimov.press/p/antibody-design','How to Design Antibodies')} (Asimov Press).</p>
  <h3>Other tools you might use</h3>
  ${res([
   ['Numbering','ANARCII','Antibody numbering, including CDR mapping.',L('https://github.com/oxpig/ANARCII','GitHub')],
   ['Structure code','Biotite','Structural bioinformatics in Python.',L('https://www.biotite-python.org/','Website')],
   ['Developability','TAP / TNP','Developability flags for conventional antibodies (TAP) and nanobodies (TNP).',L('https://opig.stats.ox.ac.uk/webapps/sabdab-sabpred/sabpred/tap','TAP')+L('https://tnp.opig.stats.ox.ac.uk/','TNP')],
   ['Interfaces','Co-folding / docking','Explore possible antibody–antigen interfaces. Predictions can be unreliable for novel complexes.','<a href="#tools">JapanFold</a>'+L('https://forge.nebius.cloud/models/','Nebius model catalog')]
  ],'two')}
  <h3>What databases exist for antibody and structural data?</h3>
  <p>You do not have to learn these by heart, but you might have a look at them and let your AI agent know about them.</p>
  ${res([
   ['Structures',L('https://opig.stats.ox.ac.uk/webapps/sabdab-sabpred/sabdab/','SAbDab / SAbDab-nano'),'Curated antibody and VHH structures.'],
   ['Sequences',L('https://opig.stats.ox.ac.uk/webapps/oas/','Observed Antibody Space'),'Large collections of antibody sequences from repertoire sequencing.'],
   ['Binding energies',L('https://life.bsc.es/pid/skempi2','SKEMPI 2.0'),'Experimental binding free-energy changes on mutation.'],
   ['Mutation data',L('https://github.com/sarahsirin/AB-Bind-Database','AB-Bind'),'Antibody-specific mutational binding data.'],
   ['Wet-lab results',L('https://design.adaptyvbio.com/','Adaptyv Bio competition data'),'Prospective wet-lab results on designed binders.'],
   ['Developability',L('https://datapoints.ginkgo.bio/dataset-access','Ginkgo Datapoints'),'Developability datasets, including sets measured on VHHs.']
  ])}
  <h3>A word of caution</h3>
  ${cards([
   ['Numbering schemes','IMGT, Kabat and Chothia label each position by its structural role, so “position 104” is the same spot in every antibody or VHH. Plain counting is not, because VHH CDR3 length varies a lot. ANARCI converts a sequence to a scheme (a VHH is numbered like a heavy-chain variable domain).'],
   ['Confidence is not affinity','pLDDT, ipTM and PAE say how sure the model is about the <i>geometry</i>, not how strongly the molecules stick. A confident complex can still bind weakly, and confidence is least reliable where prediction is hardest.']
  ])}
</div>`;

SH.tutorial=()=>`<div class="prose">
  <p class="lead">Practice with ${L('https://www.rcsb.org/structure/1ZVY','PDB entry 1ZVY')}, a complex containing a VHH and hen egg-white lysozyme. The example uses <b>chain A for the VHH</b> and <b>chain B for lysozyme</b>. Download the mmCIF file and inspect its chains and residue identifiers (you can open it in a text editor or ask AI to do it).</p>
  ${steps([
   ['Download the structure',`On ${L('https://www.rcsb.org/','RCSB PDB')}, download the mmCIF structure for ${L('https://www.rcsb.org/structure/1ZVY','1ZVY')}.`],
   ['Inspect the chains','Chain A is the VHH and chain B is the target protein. See whether any positions are missing. This structure does not resolve the first amino acid of chain A. That can happen: not all positions are experimentally resolved.'],
   ['Open JapanFold',`Open ${L('https://japanfold.aiand.com/','JapanFold')} and choose “Drug Design”, then RFD4-Proteina. Paste the mmCIF structure. Decide whether to generate a new binder or redesign part of the existing VHH.`]
  ])}
  <h3>Two ways to use RFD4-Proteina</h3>
  <p>There are two options with RFD4-Proteina (and similar contig-based models). We can design a binder to chain B (lysozyme) from scratch, or we can keep the VHH chain and ask the model to regenerate part of it. We specify this in the <b>contig</b> field.</p>
  ${cards([
   ['Option A: generate a new binder','<div class="codeblock">B1-129, /0, 110-130</div><p>Here <code>B1-129</code> is the target segment, <code>/0</code> separates chains, and <code>110-130</code> specifies a new segment of 110 to 130 residues. The resulting binder is not necessarily a VHH.</p>'],
   ['Option B: redesign a VHH loop','<div class="codeblock">B1-129, /0, A2-96, 20, A117-125</div><p>This retains target chain B, preserves VHH segments A2–96 and A117–125, and requests a new 20-residue segment between them. In the original trial, residue A1 was omitted because its coordinates were missing. Verify residue numbering against the downloaded structure before copying the example.</p>']
  ])}
  <p>The contig is a structural selection; check that the sequence positions and coordinates match the region you want to rebuild.</p>
  <h3>How do I find the CDR3?</h3>
  <p>Use ${L('https://github.com/oxpig/ANARCII','ANARCII')} or ANARCI to assign antibody numbering, then map the CDR positions onto the structure’s chain A residue identifiers. IMGT CDR positions are <b>not</b> interchangeable with PDB residue numbers. The CDR section above explains why these regions matter.</p>
  <p>A backbone-only generator may need a later sequence-design step, so inspect the outputs before assuming they are complete VHH sequences.</p>
</div>`;

SH.primers=()=>{
  const LX={
   ml:{items:[
    `<b>A model learns patterns from examples</b> and then makes predictions on new inputs.`,
    `<b>Training vs testing.</b> A model learns from <i>training data</i> and is judged on a <i>test set</i> it hasn’t seen. A score on data the model has already seen says little about new cases.`,
    `<b>Confident isn’t correct.</b> A model’s confidence score says how sure it is, not whether it’s right.`,
    `<b>Predict vs generate.</b> Some models score what exists; <i>generative</i> ones propose new candidates.`],
    more:`<li>A <i>protein language model</i> learns from millions of protein sequences, the way a text model learns from words, and turns a sequence into numbers (an <i>embedding</i>) other models can use.</li><li>A <i>structure prediction model</i> reads a sequence and predicts the 3D shape (AlphaFold is the famous one).</li><li>A <i>benchmark</i> is a standard test for comparing methods. Check what it held out.</li>`},
   bio:{items:[
    `<b>Binders are found by selection.</b> Immunize a llama, or screen a <i>library</i> of billions of variants shown on the surface of phage or yeast (<i>display</i>). Wash away what doesn’t stick, keep what does, and repeat (<i>panning</i>).`,
    `<b>Wet lab vs dry lab.</b> Molecules are made and measured in a <i>wet lab</i>: slow and costly. Computers work in the <i>dry lab</i> and can only predict.`,
    `<b>An assay turns binding into a number.</b> It is only believable next to <i>controls</i>: a known binder and a known non-binder. A result without them is hard to read.`],
    more:`<li>A <i>hit</i> is anything that binds at all; a <i>lead</i> is a hit worth improving further.</li><li>“In vitro” means in a test tube or dish; “in vivo” means in a living body. Results often differ.</li><li>Known protein structures are stored in public databases such as the PDB; antibody and VHH ones in SAbDab.</li>`},
   phys:{items:[
    `<b>Binding is a sum of small contacts.</b> Hydrogen bonds, attraction between opposite charges, and oily surfaces pressing together. Each is worth little; the total makes or brakes the complex.`,
    `<b>Tighter binding means lower energy.</b> KD converts to a binding free energy (ΔG): each ten-fold tighter KD is worth about 1.4 kcal/mol, so going from 100 nM to 1 nM gains about 2.7 kcal/mol.`,
    `<b>Speed matters too.</b> <i>k</i><sub>on</sub> is how fast a binder finds and sticks to its target, <i>k</i><sub>off</sub> how fast it lets go, and KD = <i>k</i><sub>off</sub> ÷ <i>k</i><sub>on</sub>. Two binders with the same KD can differ in how long they stay on.`,
    `<b>Freedom has a price.</b> A floppy loop that must lock into place to bind pays an energy cost (<i>entropy</i>), so a long, flexible CDR3 can look good in a picture and still bind weakly.`],
    more:`<li>ΔG = RT ln KD. A 1 nM binder is about −12 kcal/mol. Try it in the <a href="#toolbox">Toolbox</a>.</li><li>ΔΔG is the change in that energy caused by one mutation.</li><li>SPR and BLI measure <i>k</i><sub>on</sub> and <i>k</i><sub>off</sub> directly, then derive KD from them.</li>`},
   clin:{items:[
    `<b>Why antibodies?</b> They are one of the largest classes of medicines, valued for how precisely they target one thing. Nanobodies are a smaller, younger branch with a few approved drugs.`,
    `<b>Standard of care</b> is what patients get today. A new treatment must beat it or add something.`,
    `<b>Many candidates fail late,</b> often in human trials, which is most costly to fail. Predicting problems early is the whole point of developability checks.`],
    more:`<li>Trials run in phases: phase 1 checks safety, phase 2 looks for early signs it works, phase 3 compares it with the current standard of care in many patients.</li><li>ADA stands for anti-drug antibodies: the body’s own immune response against the drug.</li>`},
   biz:{items:[
    `<b>The pipeline.</b> Pick a target, find candidates, improve them, check they can be made, test in people, then seek approval. The earlier a problem is caught, the cheaper it is.`,
    `<b>Who buys what?</b> Pharma and biotech companies, and contract labs (CROs), pay for <i>decisions they can defend</i>, not for models.`,
    `<b>Value is in avoided waste.</b> Generating sequences is cheap. Saving a lab round or a late failure is what people pay for.`],
    more:`<li>Typical early stages: target selection → hit discovery → lead optimization → developability checks → manufacturing process work (CMC).</li><li>An IND is the filing that allows first tests in humans.</li>`}
  };
  const col=k=>`style="--c:var(--${TRACKMETA[k].color});--cs:var(--${TRACKMETA[k].color}-s)"`;
  return `<div class="lx">
   ${TRACK_ORDER.map((k,i)=>`<input type="radio" name="lx" id="lx-${k}"${i===0?' checked':''}>`).join('')}
   <div class="lxtabs" role="tablist">${TRACK_ORDER.map(k=>`<label for="lx-${k}" ${col(k)}><span class="ic">${svgIcon(TRACKMETA[k].icon)}</span>${TRACKMETA[k].name}</label>`).join('')}</div>
   <div class="lxpanels">${TRACK_ORDER.map(k=>{const d=LX[k];return `<div class="lxp" id="lxp-${k}" ${col(k)}>
    <h4 class="lxh">${TRACKMETA[k].name}</h4>
    <div class="lxitems" style="--n:${d.items.length}">${d.items.map((t,i)=>`<div class="lxi"><span class="n">${i+1}</span><p>${t}</p></div>`).join('')}</div>
    <details class="more"><summary>More detail</summary><ul>${d.more}</ul></details>
   </div>`}).join('')}</div>
  </div>`;
};

SH.beyond=()=>`<div class="prose">
  <p class="lead">A binder also needs properties that make it practical to produce and use as a drug. A design that binds beautifully but aggregates in the vial is worthless. Everything other than affinity is called <b>developability</b>, and it is a huge hurdle to clear.</p>
  <h3>What you can do about it on the day</h3>
  <p>You will not run experiments, so you will never <i>measure</i> developability. You will have sequences, structures and predictions, and that is enough to let it shape your choices:</p>
  ${cards([
   ['Rank beyond the binding score','When two designs look equally good at binding, the one with fewer red flags is the better bet. Checking costs seconds, and this is the step where most designs get cut.'],
   ['Fix what you can see in the sequence','Liability motifs, odd cysteine counts and oily or charged stretches show up from the sequence alone. Mutating one away is a small, concrete edit. Re-score binding afterwards: a fix that breaks the interface is no fix.'],
   ['Make your selection defensible','You choose up to 10 designs to present. Saying why each was kept, and which risks it still carries, separates “scores well” from “could one day become a drug”.']
  ])}
  <h3>What each property means, and what you can check</h3>
  ${dvmap([
   ['Stability','Does it keep its shape under different conditions?','stab','mid','Prediction only','Models can estimate it. A melting temperature (Tm) needs a lab.'],
   ['Solubility and aggregation','Does it stay soluble or clump?','sol','mid','Prediction only','Oily or strongly charged surface patches are warning signs, and TNP flags some.'],
   ['Expression','Can we produce that protein in the lab easily?','expr','lab','Needs a lab','Yield can only be measured. An odd cysteine count is a weak hint.'],
   ['Chemical liabilities','Is it prone to unwanted modifications?','chem','ok','Check from sequence','A motif scan finds them (next section, and the Toolbox).'],
   ['Immunogenicity','Could it trigger an unwanted immune response?','imm','mid','Prediction only','Staying close to germline sequences helps. T-cell epitope predictors exist.']
  ])}
  <h3>Liability motifs are just string patterns</h3>
  <p>Most chemical liabilities are short patterns you can find with a text search, which makes them an easy developability problem to act on. These are illustrative examples:</p>
  <div data-widget="motif"></div>
  <p>The ${L('https://opig.stats.ox.ac.uk/webapps/tnp','Therapeutic Nanobody Profiler (TNP)')} can flag potential VHH liabilities. These are predictions, not experimental measurements, and developability is one filter alongside the binding-related scores. Which of the examples above are relevant depends on pH, buffer and storage, which is more of a formulation question than a biology one. <a href="#toolbox">Paste a sequence into the liability scanner in the Toolbox</a> to see them highlighted.</p>
  ${more('For reference: how each property is measured in the lab, and typical targets',`${tbl(['Property','Plain meaning','How it’s measured','Typical target'],[
   ['Affinity','How tightly it grips its target','KD by SPR or BLI; lower is tighter','nM to pM: 1 nM is good, 100 pM tight, above 1 µM usually too weak'],
   ['Specificity','Does it grip <i>only</i> that target','Counter-screens, polyreactivity panels','No off-target binding'],
   ['Stability','Does it stay folded','Tm, accelerated stress','Tm above ~65 °C'],
   ['Solubility / aggregation','Does it clump when concentrated','SEC, HIC','&gt;100 mg/mL for subcutaneous'],
   ['Viscosity','Does it flow through a fine needle at that concentration','Rheometry','Injectable'],
   ['Expression yield','Can cells make enough','Titer in g/L','Grams per liter'],
   ['Immunogenicity','Will patients react against the drug','T-cell epitope prediction, ADA rates','As germline-like as possible'],
   ['Chemical liabilities','Motifs that degrade or modify','Sequence motif scan, forced degradation','Avoid in CDRs'],
   ['Half-life','How long it stays in the body','Pharmacokinetic studies','A bare VHH (~15 kDa) is filtered by the kidneys within hours; usually extended by fusing an Fc or an albumin binder']
  ])}`)}
</div>`;

SH.state=()=>`<div class="prose" style="max-width:none">
  <div class="ladder">
   ${RUNG.map(([n,w,c,v])=>`<div class="rung" style="--w:${w}%;--col:${c}"><div class="nm">${n}</div><div class="bar"><i></i></div><div class="vd">${v}</div></div>`).join('')}
   <div class="note-s">An editorial read of the field, not a benchmark. Bars show rough maturity.</div>
  </div>
  <p style="margin-top:26px" class="lead">In plain words: AI is now good at guessing <i>what shape</i> a VHH has, and still poor at predicting <i>how tightly</i> it will stick to a target. Treat any claim on the day that a model “predicts affinity” with the skepticism you’d apply to a dataset with no error bars.</p>
  <h3>Why binding is hard</h3>
  <p>Binding is a close call between big opposing forces. Contacts across the interface pull the two molecules together, while the water that has to be pushed aside and the loops that lose their freedom pull the other way. These nearly cancel, and the small remainder decides whether a binder is good. A mistake of 1.4 kcal/mol is already a tenfold error in KD. The <a href="#phys">physics and chemistry page</a> has more numbers.</p>
</div>`;

SH.judging=()=>`<div class="prose">

  <p class="lead">Among the different scoring categories, <i>Judgment</i> carries the most weight: what your tool changes, how it scores, and when it stops. <b>These weights are provisional</b> and will be confirmed in the final hackathon instructions.</p>
  ${judging()}
  <p style="margin-top:20px">Stopping criteria deserve thought. Knowing when a search has gone far enough, and saying why, is a good decision to make, and it sits inside the top-weighted criterion. A judge runs your project on a case your team hasn’t seen, so hard-coding to one antigen, dataset or lucky seed will lose you points.</p>

  <p style="margin-top:16px;color:var(--muted)">Prizes are sponsored by Apheris, OpenFold and Amass. Adaptyv will test selected designs experimentally (VHHs, Fabs and scFvs, not whole antibodies).</p>
</div>`;

 ['Notebook (Colab)','A web page where you run code in small steps with nothing to install.'],

 ['Hallmark residues','Framework-2 positions that differ from a conventional VH, keeping a VHH soluble without a light chain.'],
 ['Half-life extension','Making a small binder stay in the body longer, usually by fusing an Fc or an albumin binder.'],
 ['Framework','The conserved scaffold holding the CDR loops.'],

 ['Immunogenicity','Risk that patients mount a response against the drug.'],
 ['IMGT · Kabat · Chothia','Competing position-numbering conventions.'],
 ['IND','Investigational New Drug. The filing before first-in-human trials.'],
 ['Inverse folding','Designing a sequence to fit a given backbone (ProteinMPNN).'],
 ['Isotype','IgG1, IgG4 and so on. Sets effector function and half-life.'],
